name: Reference raw segment weights
on:
  pull_request:
    paths:
      - 'scripts/road_reference*.py'
      - 'scripts/reference_segment_cost_checkpoint.py'
      - 'scripts/reference_via_node*.py'
      - 'scripts/reference_turn_rule_checkpoint.py'
      - 'scripts/test_road_reference_segment_costs.py'
      - 'scripts/fort_collins_entry_context.py'
      - 'scripts/fort_collins_raw_context.py'
      - 'scripts/road_turn_aware_probe.py'
      - 'docs/research/reference-road-scenario/scenario.json'
      - 'docs/research/reference-via-node-compilation/**'
      - 'docs/research/reference-turn-rules/report.json'
      - 'docs/research/fort-collins-entry-context/**'
      - 'docs/research/reference-segment-costs/**'
      - '.github/workflows/reference-segment-costs.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bounded-segment-costs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'tzdata==2026.5' 'osmium==4.3.2' 'networkx==3.7' 'pyproj==3.8.0'
      - run: python -m unittest discover -s scripts -p test_road_reference_segment_costs.py -v
      - run: python scripts/reference_segment_cost_checkpoint.py
      - run: python scripts/reference_via_node_checkpoint.py
      - run: python scripts/fort_collins_entry_context.py
      - run: python scripts/las_vegas_ui_checkpoint.py --check-frozen
      - uses: actions/upload-artifact@v6
        with:
          name: reference-segment-costs
          path: docs/research/reference-segment-costs/
          if-no-files-found: error
