name: Expanded opaque source inspection
on:
  pull_request:
    paths:
      - 'scripts/fort_collins_*.py'
      - 'scripts/test_fort_collins_opaque_source_core.py'
      - 'scripts/fort_collins_gate_bounds_checkpoint.py'
      - 'scripts/fort_collins_partition*.py'
      - 'scripts/fort_collins_competitive*.py'
      - 'scripts/road_opaque_control_bounds.py'
      - 'scripts/road_competitive_core.py'
      - 'scripts/road_core_exit_bounds.py'
      - 'scripts/road_source*.py'
      - 'scripts/road_posted_speed*.py'
      - 'scripts/road_reference*.py'
      - 'scripts/road_maneuver_probe.py'
      - 'scripts/road_turn_aware_probe.py'
      - 'scripts/road_static_lane_guidance.py'
      - 'scripts/stream_osm_roads.py'
      - 'scripts/fetch_research_source.py'
      - 'scripts/research_source_cache.py'
      - 'scripts/reference_*.py'
      - 'scripts/*via_node_compile.py'
      - 'scripts/road_guidance*.py'
      - 'docs/research/fort-collins-*/**'
      - 'docs/research/reference-*/**'
      - '.github/workflows/fort-collins-opaque-source-core.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'tzdata==2026.5' 'osmium==4.3.2' 'networkx==3.7'
      - run: python -m unittest discover -s scripts -p test_fort_collins_opaque_source_core.py -v
      - run: python scripts/fort_collins_opaque_source_checkpoint.py
      - run: python scripts/fort_collins_gate_bounds_checkpoint.py
      - run: python scripts/las_vegas_ui_checkpoint.py --check-frozen
      - uses: actions/upload-artifact@v6
        with:
          name: fort-collins-opaque-source-core
          path: docs/research/fort-collins-opaque-source-core/
          if-no-files-found: error
  original-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        partition: [0, 1]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'tzdata==2026.5' 'osmium==4.3.2' 'networkx==3.7'
      - id: source_cache
        name: Derive existing original-source cache identity
        run: |
          python - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from research_source_cache import cache_key, MANIFEST
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as handle:
              handle.write('key=' + cache_key(json.loads(MANIFEST.read_text())) + '\n')
          PY
      - uses: actions/cache/restore@v4
        with:
          path: local-data/*.osm.pbf
          key: ${{ steps.source_cache.outputs.key }}
      - run: python scripts/fetch_research_source.py --source colorado.osm.pbf --output local-data/colorado.osm.pbf
      - name: Reproduce all raw incident ways, nodes and touching declarations
        run: |
          python scripts/fort_collins_opaque_source_core.py --osm local-data/colorado.osm.pbf --partition ${{ matrix.partition }} --output /tmp/source-partition-${{ matrix.partition }}.json
          cmp /tmp/source-partition-${{ matrix.partition }}.json docs/research/fort-collins-opaque-source-core/source-partition-${{ matrix.partition }}.json
