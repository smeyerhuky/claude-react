name: Colorado geographic correctness validation
# Set repository Actions variable COLORADO_GEO_VALIDATION_AUTO=false to
# disable automatic checks. Manual workflow_dispatch always remains available.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/colorado-geographic-validation.yml'
      - 'scripts/validate_colorado_geography.py'
      - 'scripts/colorado_edge_midpoint_diagnostics.py'
      - 'scripts/test_colorado_edge_midpoint_diagnostics.py'
      - 'scripts/colorado_geographic_point_diagnostics.py'
      - 'scripts/colorado_geographic_point_smoke.py'
      - 'scripts/test_colorado_geographic_point_diagnostics.py'
      - 'scripts/colorado_metro_winners.py'
      - 'scripts/test_colorado_metro_winners.py'
      - 'scripts/colorado_connector_evidence.py'
      - 'scripts/test_colorado_connector_evidence.py'
      - 'scripts/colorado_release_approval.py'
      - 'scripts/colorado_reviewed_connectors.json'
      - 'scripts/test_colorado_release_approval.py'
      - 'scripts/road_spike.py'
      - 'scripts/stream_osm_roads.py'
      - 'public/data/metros-census-2025.csv'
  pull_request:
    paths:
      - '.github/workflows/colorado-geographic-validation.yml'
      - 'scripts/validate_colorado_geography.py'
      - 'scripts/colorado_edge_midpoint_diagnostics.py'
      - 'scripts/test_colorado_edge_midpoint_diagnostics.py'
      - 'scripts/colorado_geographic_point_diagnostics.py'
      - 'scripts/colorado_geographic_point_smoke.py'
      - 'scripts/test_colorado_geographic_point_diagnostics.py'
      - 'scripts/colorado_metro_winners.py'
      - 'scripts/test_colorado_metro_winners.py'
      - 'scripts/colorado_connector_evidence.py'
      - 'scripts/test_colorado_connector_evidence.py'
      - 'scripts/colorado_release_approval.py'
      - 'scripts/colorado_reviewed_connectors.json'
      - 'scripts/test_colorado_release_approval.py'
      - 'scripts/road_spike.py'
      - 'scripts/stream_osm_roads.py'
      - 'public/data/metros-census-2025.csv'
permissions:
  contents: read
jobs:
  validate:
    # An unset variable defaults to enabled; explicit 'false' disables auto only.
    if: ${{ github.event_name == 'workflow_dispatch' || vars.COLORADO_GEO_VALIDATION_AUTO != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y osmium-tool
          python -m pip install 'networkx>=3.4,<4' 'osmium>=4,<5' 'scipy>=1.14,<2'
      - name: Metro allocation access-gate and threshold synthetic tests
        run: PYTHONPATH=scripts python -m unittest scripts/test_colorado_metro_winners.py -v
      - name: Connector evidence contract tests
        run: PYTHONPATH=scripts python -m unittest scripts/test_colorado_connector_evidence.py -v
      - name: Independent connector release approval and tamper regression tests
        run: PYTHONPATH=scripts python -m unittest scripts/test_colorado_release_approval.py -v
      - name: Geographic polyline projection and access-ambiguity synthetic tests
        run: PYTHONPATH=scripts python -m unittest scripts/test_colorado_geographic_point_diagnostics.py -v
      - name: Directed fractional-edge synthetic tests
        run: PYTHONPATH=scripts python -m unittest scripts/test_colorado_edge_midpoint_diagnostics.py -v
      - name: Download and filter real Colorado roads
        run: |
          set -euo pipefail
          mkdir -p local-data colorado-geographic-validation
          curl -fLSs --retry 3 --connect-timeout 20 --max-time 1200 -o local-data/colorado.osm.pbf https://download.geofabrik.de/north-america/us/colorado-latest.osm.pbf
          sha256sum local-data/colorado.osm.pbf > colorado-geographic-validation/source-sha256.txt
          osmium extract --bbox=-106.1,38.65,-104.5,40.1 --strategy=complete_ways local-data/colorado.osm.pbf -o local-data/corridor.osm.pbf
          osmium tags-filter local-data/corridor.osm.pbf w/highway=motorway,motorway_link,trunk,trunk_link,primary,primary_link,secondary,secondary_link,tertiary,tertiary_link,residential,unclassified,living_street,service -o local-data/roads.osm.pbf
      - name: Independently check directed road-node winners
        run: |
          set -o pipefail
          /usr/bin/time -v -o colorado-geographic-validation/resources.txt timeout --signal=TERM --kill-after=30s 25m python -u scripts/validate_colorado_geography.py --osm local-data/roads.osm.pbf --samples 8 --output colorado-geographic-validation/report.json 2>&1 | tee colorado-geographic-validation/processing.log
      - name: Diagnostic directed fractional-edge checks
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=30s 12m python -u scripts/colorado_edge_midpoint_diagnostics.py --osm local-data/roads.osm.pbf --samples 4 --output colorado-geographic-validation/edge-midpoints.json 2>&1 | tee colorado-geographic-validation/edge-midpoints.log
      - name: Diagnostic arbitrary Colorado coordinate over full clipped road graph
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=30s 10m python -u scripts/colorado_geographic_point_smoke.py --osm local-data/roads.osm.pbf --lon=-104.9903 --lat=39.7392 --output colorado-geographic-validation/geographic-point-smoke.json 2>&1 | tee colorado-geographic-validation/geographic-point-smoke.log
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: colorado-geographic-validation
          path: colorado-geographic-validation/
          retention-days: 14
