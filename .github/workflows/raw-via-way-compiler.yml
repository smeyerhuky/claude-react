name: Strict raw via-way compiler
on:
  pull_request:
    paths:
      - 'scripts/road_via_way_compile.py'
      - 'scripts/test_road_via_way_compile.py'
      - 'scripts/via_way_raw_context.py'
      - 'scripts/via_way_compiler_checkpoint.py'
      - 'scripts/road_maneuver_probe.py'
      - 'scripts/road_turn_aware_probe.py'
      - 'scripts/tucson_turn_probe.py'
      - 'scripts/stream_osm_roads.py'
      - 'scripts/fetch_research_source.py'
      - 'docs/research/census-33-source-checkpoint/baseline.json'
      - 'docs/research/raw-via-way-compiler/**'
      - '.github/workflows/raw-via-way-compiler.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  raw-compiler-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'networkx==3.7' 'osmium==4.3.2'
      - run: python -m unittest discover -s scripts -p test_road_via_way_compile.py -v
      - run: python -m unittest discover -s scripts -p test_road_maneuver_probe.py -v
      - run: python scripts/via_way_compiler_checkpoint.py
      - run: python scripts/las_vegas_ui_checkpoint.py --check-frozen
  exact-member-context:
    strategy:
      fail-fast: false
      matrix:
        state: [colorado, arizona]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'osmium==4.3.2'
      - name: Fetch and verify the exact original public input
        env:
          RESEARCH_STATE: ${{ matrix.state }}
        run: |
          mkdir -p local-data
          curl -fLSs --retry 3 --connect-timeout 20 --max-time 600 --output "local-data/$RESEARCH_STATE.osm.pbf" "https://download.geofabrik.de/north-america/us/$RESEARCH_STATE-261027.osm.pbf"
          python scripts/fetch_research_source.py --source "$RESEARCH_STATE.osm.pbf" --output "local-data/$RESEARCH_STATE.osm.pbf"
      - name: Re-extract every selected raw way and restriction
        env:
          RESEARCH_STATE: ${{ matrix.state }}
        run: |
          python scripts/via_way_raw_context.py --state "$RESEARCH_STATE" --osm "local-data/$RESEARCH_STATE.osm.pbf" --output /tmp/member-context.json
          cmp /tmp/member-context.json "docs/research/raw-via-way-compiler/$RESEARCH_STATE-context.json"
