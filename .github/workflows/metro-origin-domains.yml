name: Census US and Puerto Rico research metro origin domains
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/metro-origin-domains.yml'
      - 'scripts/metro_origin_domains.py'
      - 'scripts/metro_origin_domain_sources.json'
      - 'scripts/test_metro_origin_domains.py'
      - 'scripts/colorado_tiger2025_geography.py'
      - 'scripts/build_metro_census_data.py'
      - 'public/data/metros-census-2025.csv'
permissions:
  contents: read
jobs:
  actual-census-source-domains:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'shapely>=2,<3' 'pyshp>=2.3,<3' 'pyproj>=3.7,<4' 'openpyxl>=3.1,<4' 'networkx>=3.4,<4' 'osmium>=4,<5'
      - run: PYTHONPATH=scripts python -m unittest -v scripts/test_metro_origin_domains.py
      - name: Acquire exact official 2025 Census population, CBSA and place sources
        run: |
          set -euo pipefail
          mkdir -p local-data origin-domains
          curl -fLSs --retry 3 --max-time 180 -o local-data/cbsa-met-est2025-pop.xlsx https://www2.census.gov/programs-surveys/popest/tables/2020-2025/metro/totals/cbsa-met-est2025-pop.xlsx
          curl -fLSs --retry 3 --max-time 600 -o local-data/tl_2025_us_cbsa.zip https://www2.census.gov/geo/tiger/TIGER2025/CBSA/tl_2025_us_cbsa.zip
          curl -fLSs --retry 3 --max-time 180 -o local-data/2025_gaz_place_08.txt https://www2.census.gov/geo/docs/maps-data/data/gazetteer/2025_Gazetteer/2025_gaz_place_08.txt
      - name: Preserve existing scenarios and expose complete supplied-source eligibility
        run: |
          set -euo pipefail
          python scripts/colorado_origin_scenarios.py --metros public/data/metros-census-2025.csv \
            --places local-data/2025_gaz_place_08.txt --output origin-domains/scenarios.json
          python scripts/metro_origin_domains.py --metros public/data/metros-census-2025.csv \
            --population local-data/cbsa-met-est2025-pop.xlsx --cbsa-zip local-data/tl_2025_us_cbsa.zip \
            --scenarios origin-domains/scenarios.json --output origin-domains/domains.json
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          r = json.loads(Path("origin-domains/domains.json").read_text())
          assert len(r["existing_csv_cbsa_ids"]) == 359
          assert len(r["source_qualifying_cbsa_ids"]) == 367
          assert r["source_qualifiers_absent_from_existing_csv"] == ["10380","11260","11640","27980","32420","38660","41980","46520"]
          assert len(r["domains"]) == len({x["cbsa"] for x in r["domains"]}) == 367
          assert all(x["hypothetical_urban_origin_covering_ball"]["radius_upper_bound_m"] > 0 for x in r["domains"])
          assert r["native_crs"] == "EPSG:4269" and r["datum_alignment_verified"] is False
          assert r["release_eligible"] is False and r["access_certified"] is False
          assert r["road_coverage_certified"] is False and r["complete_global_competition"] is False
          assert len(r["selected_urban_lead_membership"]) == 7
          assert all(x["inside_native_cbsa_polygon"] and not x["access_verified"] for x in r["selected_urban_lead_membership"])
          assert hashlib.sha256(Path("public/data/metros-census-2025.csv").read_bytes()).hexdigest() == "ecd594584ff6ab074a94fbad5c85ec2506b0c4e0d4c4870120d7e3d0b5b795f8"
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: census-research-metro-origin-domains
          path: origin-domains/
          retention-days: 14
