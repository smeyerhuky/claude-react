name: Colorado route explorer (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  explorer:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y osmium-tool
          python -m pip install 'networkx>=3.4,<4' 'osmium>=4,<5' 'matplotlib>=3.8,<4'
      - name: Download and extract Colorado roads
        run: |
          set -euo pipefail
          mkdir -p local-data
          curl -fLSs --retry 3 --connect-timeout 20 --max-time 1200 -o local-data/colorado.osm.pbf 'https://download.geofabrik.de/north-america/us/colorado-latest.osm.pbf'
          sha256sum local-data/colorado.osm.pbf > local-data/source-sha256.txt
          osmium extract --bbox=-105.35,38.65,-104.5,40.05 --strategy=complete_ways local-data/colorado.osm.pbf -o local-data/corridor.osm.pbf
          osmium tags-filter local-data/corridor.osm.pbf w/highway=motorway,motorway_link,trunk,trunk_link,primary,primary_link,secondary,secondary_link,tertiary,tertiary_link,residential,unclassified,living_street,service -o local-data/roads.osm.pbf
      - name: Synthetic route explorer regression tests
        run: PYTHONPATH=scripts python -m unittest discover -s scripts -p 'test_colorado_route_explorer.py' -v
      - name: Offline interactive viewer regression tests\n        run: PYTHONPATH=scripts python -m unittest discover -s scripts -p 'test_colorado_route_explorer_html.py' -v\n      - name: Render and validate real Colorado routes
        run: |
          set -euo pipefail
          mkdir -p route-explorer
          cp local-data/source-sha256.txt route-explorer/
          python -u scripts/colorado_route_explorer.py --osm local-data/roads.osm.pbf --output-dir route-explorer 2>&1 | tee route-explorer/processing.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: colorado-route-explorer
          path: route-explorer/
          retention-days: 14
