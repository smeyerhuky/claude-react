name: Colorado bounded node-union preflight
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/colorado-node-union-preflight.yml'
      - 'scripts/colorado_node_union_preflight.py'
      - 'scripts/test_colorado_node_union_preflight.py'
      - 'scripts/colorado_adjacent_source_interfaces.py'
      - 'scripts/colorado_raw_boundary_interfaces.py'
      - 'scripts/stream_osm_roads.py'
      - 'docs/research/oklahoma-preflight-reference.json'
permissions:
  contents: read
jobs:
  reproduce-resource-counterexample:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'networkx>=3.4,<4' 'osmium>=4,<5' 'scipy>=1.14,<2'
      - run: PYTHONPATH=scripts python -m unittest -v scripts/test_colorado_node_union_preflight.py
      - name: Acquire five exact dated source files without accepting changed bytes
        run: |
          python - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          m=json.loads(Path('docs/research/oklahoma-preflight-reference.json').read_text())
          root=Path('local-data');root.mkdir(exist_ok=True)
          for source in m['source_provenance']:
              name=source['name'];p=root/name
              url='https://download.geofabrik.de/north-america/us/'+name.removesuffix('.osm.pbf')+'-261027.osm.pbf'
              subprocess.run(['curl','-fLSs','--retry','3','--connect-timeout','20','--max-time','1200','--output',str(p),url],check=True)
              assert p.stat().st_size==source['size_bytes']
              with p.open('rb') as f:
                  assert hashlib.file_digest(f,'sha256').hexdigest()==source['sha256']
          PY
      - name: Reproduce stopped lower bound and preserve every complete prefix count
        run: |
          python -u scripts/colorado_node_union_preflight.py --parent-osm local-data/colorado.osm.pbf local-data/new-mexico.osm.pbf local-data/arizona.osm.pbf local-data/utah.osm.pbf local-data/oklahoma.osm.pbf --output node-preflight/report.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: colorado-node-union-preflight
          path: node-preflight/
          retention-days: 14
