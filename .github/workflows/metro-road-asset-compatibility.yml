name: Metro road asset compatibility
on:
  pull_request:
    paths:
      - 'src/research/metroRoadAssetCompatibility.js'
      - 'scripts/test_metro_road_asset_compatibility.mjs'
      - 'scripts/check_metro_road_asset_compatibility.cjs'
      - 'docs/research/road-asset-compatibility/**'
      - '.github/workflows/metro-road-asset-compatibility.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  asset-byte-and-context-checks:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: node --test scripts/test_metro_road_asset_compatibility.mjs
      - name: Install isolated browser driver
        run: npm install --prefix "$RUNNER_TEMP/metro-road-asset-driver" --no-audit --no-fund playwright@1.56.1
      - name: Verify WebCrypto and all directed metric contexts in Chromium
        env:
          NODE_PATH: ${{ runner.temp }}/metro-road-asset-driver/node_modules
        run: node scripts/check_metro_road_asset_compatibility.cjs
