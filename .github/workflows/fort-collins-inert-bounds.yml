name: Inert NO prohibition and expanded opaque bounds
on:
  pull_request:
    paths:
      - 'scripts/road_inert_no_prohibition.py'
      - 'scripts/test_road_inert_no_prohibition.py'
      - 'scripts/test_fort_collins_inert_bounds.py'
      - 'scripts/fort_collins_*.py'
      - 'scripts/road_opaque_control_bounds.py'
      - 'scripts/road_guidance*.py'
      - 'scripts/road_static_lane_guidance.py'
      - 'scripts/*via_node_compile.py'
      - 'scripts/reference_*.py'
      - 'scripts/road_reference*.py'
      - 'scripts/road_posted_speed*.py'
      - 'scripts/road_maneuver_probe.py'
      - 'scripts/road_turn_aware_probe.py'
      - 'scripts/road_source_partition_union.py'
      - 'docs/research/fort-collins-*/**'
      - 'docs/research/reference-*/**'
      - '.github/workflows/fort-collins-inert-bounds.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inert-prohibition-bounds:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'tzdata==2026.5' 'osmium==4.3.2' 'networkx==3.7'
      - run: python -m unittest discover -s scripts -p test_road_inert_no_prohibition.py -v
      - run: python -m unittest discover -s scripts -p test_fort_collins_inert_bounds.py -v
      - run: python scripts/fort_collins_inert_bounds_checkpoint.py
      - run: python scripts/fort_collins_opaque_source_checkpoint.py
      - run: python scripts/las_vegas_ui_checkpoint.py --check-frozen
      - uses: actions/upload-artifact@v6
        with:
          name: fort-collins-inert-prohibition-bounds
          path: docs/research/fort-collins-inert-prohibition-bounds/
          if-no-files-found: error
