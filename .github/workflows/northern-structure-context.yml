name: Northern CDOT structure and access context
on:
  pull_request:
    paths:
      - 'scripts/*northern_structure_context.py'
      - 'docs/research/northern-structure-context/**'
      - 'docs/research/northern-endpoint-evidence/**'
      - 'docs/research/northern-site-imagery/report.json'
      - 'docs/research/northern-local-detours/report.json'
      - '.github/workflows/northern-structure-context.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-cdot-structure-context:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'networkx==3.7' 'osmium==4.3.2' 'tzdata==2026.5' 'pyproj==3.8.0' 'pillow==12.3.0' 'openpyxl==3.1.5'
      - name: Complete queries, source identities and invalid grade-inference checks
        run: python -m unittest discover -s scripts -p test_northern_structure_context.py -v
      - name: Re-fetch all 33 primary sources and reproduce the protected context
        run: python scripts/northern_structure_context.py --original-dir "$RUNNER_TEMP/northern-structure-originals" --download
      - name: Preserve the historical 33-source checkpoint
        run: python scripts/las_vegas_ui_checkpoint.py --check-frozen
      - name: Retain derived source context and fresh receipts only
        run: |
          mkdir -p /tmp/northern-structure-artifact
          cp docs/research/northern-structure-context/* /tmp/northern-structure-artifact/
          cp "$RUNNER_TEMP/northern-structure-originals/fresh-source-receipts.json" /tmp/northern-structure-artifact/
      - uses: actions/upload-artifact@v6
        with:
          name: northern-cdot-structure-context
          path: /tmp/northern-structure-artifact/
          if-no-files-found: error
          retention-days: 14
