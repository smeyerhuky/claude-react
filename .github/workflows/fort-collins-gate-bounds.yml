name: Opaque gate conditional cost bounds
on:
  pull_request:
    paths:
      - 'scripts/road_opaque_control_bounds.py'
      - 'scripts/test_road_opaque_control_bounds.py'
      - 'scripts/fort_collins_gate_bounds_checkpoint.py'
      - 'scripts/test_fort_collins_gate_bounds.py'
      - 'scripts/road_maneuver_probe.py'
      - 'scripts/road_turn_aware_probe.py'
      - 'scripts/road_reference*.py'
      - 'scripts/reference_*.py'
      - 'scripts/road_guidance*.py'
      - 'scripts/road_posted_speed*.py'
      - 'scripts/road_source_partition_union.py'
      - 'scripts/fort_collins_*.py'
      - 'docs/research/fort-collins-*/**'
      - 'docs/research/reference-*/**'
      - '.github/workflows/fort-collins-gate-bounds.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  conditional-cost-brackets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'tzdata==2026.5' 'osmium==4.3.2' 'networkx==3.7'
      - run: python -m unittest discover -s scripts -p test_road_opaque_control_bounds.py -v
      - run: python -m unittest discover -s scripts -p test_fort_collins_gate_bounds.py -v
      - run: python scripts/fort_collins_gate_bounds_checkpoint.py
      - run: python scripts/fort_collins_partition_checkpoint.py
      - run: python scripts/las_vegas_ui_checkpoint.py --check-frozen
      - uses: actions/upload-artifact@v6
        with:
          name: fort-collins-gate-uncertainty
          path: docs/research/fort-collins-gate-uncertainty/
          if-no-files-found: error
