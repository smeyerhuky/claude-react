name: Bounded road maneuver history
on:
  pull_request:
    paths:
      - 'scripts/road_maneuver_probe.py'
      - 'scripts/test_road_maneuver_probe.py'
      - 'scripts/road_turn_aware_probe.py'
      - 'docs/research/road-maneuver-history.md'
      - '.github/workflows/road-maneuver-history.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  maneuver-history:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'networkx==3.7'
      - run: python -m unittest discover -s scripts -p test_road_maneuver_probe.py -v
      - run: python scripts/las_vegas_ui_checkpoint.py --check-frozen
