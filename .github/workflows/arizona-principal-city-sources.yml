name: Arizona principal-city source work
on:
  pull_request:
    paths:
      - 'docs/research/arizona-principal-city-sources/**'
      - 'docs/research/principal-city-inventory/report.json'
      - 'docs/research/tucson-parking-publication/**'
      - 'scripts/arizona_principal_city_source_screen.py'
      - 'scripts/test_arizona_principal_city_source_screen.py'
      - '.github/workflows/arizona-principal-city-sources.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  principal-city-source-work:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'pypdf==6.10.0'
      - run: python -m unittest discover -s scripts -p test_arizona_principal_city_source_screen.py -v
      - run: python scripts/arizona_principal_city_source_screen.py
      - run: python scripts/tucson_parking_publication.py
      - run: python scripts/las_vegas_ui_checkpoint.py --check-frozen
