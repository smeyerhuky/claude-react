name: Arkansas principal-city publication work
on:
  pull_request:
    paths:
      - 'docs/research/arkansas-principal-city-sources/**'
      - 'docs/research/principal-city-inventory/report.json'
      - 'scripts/principal_city_source_screen.py'
      - 'scripts/arkansas_principal_city_source_screen.py'
      - 'scripts/test_arkansas_principal_city_source_screen.py'
      - '.github/workflows/arkansas-principal-city-sources.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  principal-city-publication-work:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts -p 'test_*_principal_city_source_screen.py' -v
      - run: python scripts/arkansas_principal_city_source_screen.py
      - run: python scripts/principal_city_source_work.py
      - run: python scripts/las_vegas_ui_checkpoint.py --check-frozen
      - uses: actions/upload-artifact@v6
        with:
          name: arkansas-principal-city-publication-work
          path: docs/research/arkansas-principal-city-sources/
          retention-days: 14
