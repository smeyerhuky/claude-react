name: Northern Colorado native path witnesses
on:
  pull_request:
    paths:
      - 'scripts/*northern_urban_path_checkpoint.py'
      - 'scripts/*road_maneuver_subset_projection.py'
      - 'scripts/road_maneuver_probe.py'
      - 'scripts/road_turn_aware_probe.py'
      - 'scripts/road_posted_speed_weights.py'
      - 'scripts/road_reference*.py'
      - 'scripts/road_guidance*.py'
      - 'scripts/road_static_lane_guidance.py'
      - 'scripts/guidance_via_node_compile.py'
      - 'scripts/reference_via_*compile.py'
      - 'scripts/colorado_principal_city_domains.py'
      - 'scripts/colorado_geographic_mask.py'
      - 'scripts/larimer_census_water_mask.py'
      - 'scripts/metro_competition_bounds.py'
      - 'scripts/metro_principal_city_inventory.py'
      - 'scripts/stream_osm_roads.py'
      - 'scripts/fetch_research_source.py'
      - 'scripts/research_source_cache.py'
      - 'scripts/research-source-snapshots/co-nm-az-20261027.json'
      - 'docs/research/northern-urban-paths/**'
      - 'docs/research/reference-road-scenario/**'
      - 'docs/research/colorado-principal-city-domains/**'
      - 'docs/research/principal-city-inventory/**'
      - 'docs/research/metro-graph-bundle-input-contract/bundle.json'
      - '.github/workflows/northern-urban-paths.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-original-regional-witnesses:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'osmium==4.3.2' 'networkx==3.7' 'tzdata==2026.5' 'shapely>=2,<3' 'openpyxl==3.1.5'
      - name: Projection oracle and witness negative checks
        run: |
          python -m unittest discover -s scripts -p test_road_maneuver_subset_projection.py -v
          python -m unittest discover -s scripts -p test_northern_urban_path_checkpoint.py -v
      - id: source_cache
        name: Derive the existing exact original-source cache identity
        run: |
          python - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from research_source_cache import cache_key, MANIFEST
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as handle:
              handle.write('key=' + cache_key(json.loads(MANIFEST.read_text())) + '\n')
          PY
      - uses: actions/cache/restore@v4
        with:
          path: local-data/*.osm.pbf
          key: ${{ steps.source_cache.outputs.key }}
      - name: Recover the complete exact Colorado extract with read-only PR permissions
        run: python scripts/fetch_research_source.py --source colorado.osm.pbf --output local-data/colorado.osm.pbf
      - name: Re-extract, compile, search and compare every retained byte-level value
        run: python scripts/northern_urban_path_checkpoint.py --osm local-data/colorado.osm.pbf
      - name: Preserve the historical 33-source checkpoint
        run: python scripts/las_vegas_ui_checkpoint.py --check-frozen
      - uses: actions/upload-artifact@v6
        with:
          name: northern-urban-path-witnesses
          path: docs/research/northern-urban-paths/
          if-no-files-found: error
          retention-days: 14
