  workflow_dispatch:
permissions:
  contents: read
jobs:
  directed-algorithm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'networkx>=3.4,<4' 'osmium>=4,<5' 'scipy>=1.14,<2' 'pillow>=11,<13' 'matplotlib>=3.9,<4' 'shapely>=2,<3' 'pyshp>=2.3,<3' 'pyproj>=3.7,<4' 'tzdata==2026.5' 'pypdf==6.10.0' 'openpyxl==3.1.5'
      - run: python -m py_compile scripts/stream_osm_roads.py scripts/visualize_colorado_roads.py
      - run: python -m unittest discover -s scripts -p 'test_*.py' -v
      # Deliberately no Overpass requests in CI. Actual road graph input is
      # a separately acquired, versioned research dataset.
