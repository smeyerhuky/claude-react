name: Road allocation spike tests
on:
  pull_request:
    paths:
      - 'scripts/road_spike.py'
      - 'scripts/test_road_direction_budgets.py'
      - 'scripts/colorado_real_directed_competition.py'
      - 'scripts/test_colorado_real_directed_competition.py'
      - 'scripts/colorado_road_subdivision_preservation.py'
      - 'scripts/test_colorado_road_subdivision_preservation.py'
      - 'scripts/stream_osm_roads.py'
      - 'scripts/road_segment_snapping.py'
      - 'scripts/road_access_diagnostics.py'
      - 'scripts/road_access_policy.py'
      - 'scripts/test_road_access_policy.py'
      - 'scripts/test_road_access_diagnostics.py'
      - 'scripts/road_edge_grid_index.py'
      - 'scripts/benchmark_road_snapping.py'
      - 'scripts/benchmark_real_road_snapping.py'
      - 'scripts/road_access_real_audit.py'
      - 'scripts/test_road_access_real_audit.py'
      - 'scripts/test_benchmark_road_snapping.py'
      - 'scripts/test_road_edge_grid_index.py'
      - 'scripts/test_road_segment_snapping.py'
      - 'scripts/test_stream_osm_roads.py'
      - 'scripts/visualize_colorado_roads.py'
      - '.github/workflows/colorado-road-evidence.yml'
      - 'scripts/test_road_spike.py'
      - 'scripts/get_road_spike_graph.py'
      - '.github/workflows/road-spike-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  directed-algorithm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'networkx>=3.4,<4' 'osmium>=4,<5' 'scipy>=1.14,<2' 'pillow>=11,<13' 'matplotlib>=3.9,<4' 'shapely>=2,<3' 'pyshp>=2.3,<3'
      - run: python -m py_compile scripts/stream_osm_roads.py scripts/visualize_colorado_roads.py
      - run: python -m unittest discover -s scripts -p 'test_*.py' -v
      # Deliberately no Overpass requests in CI. Actual road graph input is
      # a separately acquired, versioned research dataset.
