name: Colorado OSM road comparison (manual)
on:
  workflow_dispatch:
    inputs:
      threshold:
        description: Census metro population threshold (100000 includes more Front Range centers)
        type: choice
        options: ['100000', '250000']
        default: '100000'
permissions:
  contents: read
jobs:
  road-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install local OSM processing
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y osmium-tool
          python -m pip install 'networkx>=3.4,<4' 'osmium>=4,<5' 'scipy>=1.14,<2' 'matplotlib>=3.9,<4'
      - name: Download dated Colorado OpenStreetMap extract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p local-data
          curl -fLSs --retry 3 --connect-timeout 20 --max-time 1200 -o local-data/colorado.osm.pbf \
            'https://download.geofabrik.de/north-america/us/colorado-latest.osm.pbf'
          sha256sum local-data/colorado.osm.pbf > local-data/source-sha256.txt
          date -u '+download_utc=%Y-%m-%dT%H:%M:%SZ' | tee local-data/source-metadata.txt
          echo 'source=https://download.geofabrik.de/north-america/us/colorado-latest.osm.pbf' >> local-data/source-metadata.txt
          du -h local-data/colorado.osm.pbf
      - name: Extract finite Front Range / foothills road corridor
        shell: bash
        run: |
          set -euo pipefail
          # Includes Denver, Colorado Springs and Pueblo centers; corridor edge
          # routes may leave this box, so this is not production route truth.
          osmium extract --bbox=-105.35,38.65,-104.5,40.05 \
            --strategy=complete_ways local-data/colorado.osm.pbf \
            -o local-data/corridor.osm.pbf --overwrite
          osmium tags-filter local-data/corridor.osm.pbf \
            w/highway=motorway,motorway_link,trunk,trunk_link,primary,primary_link,secondary,secondary_link,tertiary,tertiary_link,residential,unclassified,living_street,service \
            -o local-data/roads.osm.pbf --overwrite
      - name: Run directed road-node comparison and metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p road-proof
          echo "Starting graph processing at $(date -u +%FT%TZ)"
          /usr/bin/time -v -o road-proof/resource-usage.txt timeout --signal=TERM --kill-after=30s 15m \
            python -u scripts/visualize_colorado_roads.py --osm local-data/roads.osm.pbf --threshold ${{ inputs.threshold }} --output-dir road-proof \
            2>&1 | tee road-proof/processing.log
          echo "Graph comparison complete at $(date -u +%FT%TZ)"
          cp local-data/source-sha256.txt road-proof/
          cp local-data/source-metadata.txt road-proof/
      - name: Upload real-road evidence and metadata
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: colorado-real-road-experiment
          include-hidden-files: true
          path: road-proof/
          if-no-files-found: warn
          retention-days: 14
