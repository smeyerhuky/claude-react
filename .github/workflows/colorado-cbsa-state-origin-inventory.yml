name: Colorado CBSA representative-origin state inventory contracts
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/colorado_cbsa_state_origin_inventory.py'
      - 'scripts/test_colorado_cbsa_state_origin_inventory.py'
      - '.github/workflows/colorado-cbsa-state-origin-inventory.yml'
permissions:
  contents: read
jobs:
  origin-inventory-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'shapely>=2,<3' 'pyshp>=2.3,<3'
      - run: PYTHONPATH=scripts python -m unittest -v scripts/test_colorado_cbsa_state_origin_inventory.py
