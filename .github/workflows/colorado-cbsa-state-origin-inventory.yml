name: Colorado CBSA representative-origin state inventory contracts
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/colorado_cbsa_state_origin_inventory.py'
      - 'scripts/test_colorado_cbsa_state_origin_inventory.py'
      - '.github/workflows/colorado-cbsa-state-origin-inventory.yml'
permissions:
  contents: read
jobs:
  origin-inventory-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'shapely>=2,<3' 'pyshp>=2.3,<3'
      - run: PYTHONPATH=scripts python -m unittest -v scripts/test_colorado_cbsa_state_origin_inventory.py
  real-census-state-origin-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'shapely>=2,<3' 'pyshp>=2.3,<3'
      - name: Acquire independently sourced official Census TIGER2025 Colorado state polygon
        run: |
          PYTHONPATH=scripts python - <<'PY'
          from colorado_tiger2025_geography import _download_census_zip, STATE_FILENAME
          _, provenance = _download_census_zip("local-data/tiger2025", "STATE", STATE_FILENAME)
          print(provenance)
          PY
      - name: Classify all qualifying national CBSA representative points
        run: |
          set -euo pipefail
          python scripts/colorado_cbsa_state_origin_inventory.py \
            --metros public/data/metros-census-2025.csv \
            --tiger-state-zip local-data/tiger2025/tl_2025_us_state.zip \
            --output colorado-cbsa-state-origin-inventory.json
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path("colorado-cbsa-state-origin-inventory.json").read_text())
          assert r["qualifying_cbsa_count"] == 359
          assert r["representative_points_inside_colorado_count"] > 0
          assert r["representative_points_outside_colorado_count"] > 0
          assert r["global_competitor_exclusion_permitted"] is False
          assert r["release_eligible"] is False
          PY
      - uses: actions/upload-artifact@v6
        with:
          name: colorado-cbsa-state-origin-inventory
          path: colorado-cbsa-state-origin-inventory.json
          retention-days: 14
