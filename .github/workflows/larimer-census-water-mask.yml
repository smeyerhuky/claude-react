name: Larimer Census water-mask checkpoint
on:
  pull_request:
    paths:
      - 'scripts/larimer_census_water_mask.py'
      - 'scripts/render_larimer_census_water_mask.py'
      - 'scripts/test_larimer_census_water_mask.py'
      - 'scripts/colorado_geographic_mask.py'
      - 'docs/research/larimer-census-water-mask/**'
      - '.github/workflows/larimer-census-water-mask.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-source-and-pixel-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'numpy>=2,<3' 'shapely>=2,<3' 'pyshp>=2.3,<3' 'pyproj>=3.7,<4' 'matplotlib>=3.9,<4'
      - run: python -m unittest discover -s scripts -p test_larimer_census_water_mask.py -v
      - name: Download pinned public Census originals
        run: |
          mkdir -p "$RUNNER_TEMP/larimer-originals"
          curl -fLsS --retry 2 --max-time 90 -o "$RUNNER_TEMP/larimer-originals/tl_2025_08069_areawater.zip" https://www2.census.gov/geo/tiger/TIGER2025/AREAWATER/tl_2025_08069_areawater.zip
          curl -fLsS --retry 2 --max-time 90 -o "$RUNNER_TEMP/larimer-originals/cb_2025_us_county_500k.zip" https://www2.census.gov/geo/tiger/GENZ2025/shp/cb_2025_us_county_500k.zip
      - name: Require exact original hashes and byte-identical geometry derivation
        run: python scripts/larimer_census_water_mask.py --original-dir "$RUNNER_TEMP/larimer-originals"
      - name: Stage derived records and comparison figure only
        run: |
          mkdir -p /tmp/larimer-mask-artifact
          cp docs/research/larimer-census-water-mask/* /tmp/larimer-mask-artifact/
          python scripts/render_larimer_census_water_mask.py /tmp/larimer-mask-artifact/larimer-mask.png
      - uses: actions/upload-artifact@v6
        with:
          name: larimer-census-water-mask
          path: /tmp/larimer-mask-artifact/
          retention-days: 14
