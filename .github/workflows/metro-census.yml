name: Refresh official Census metro data
on:
  pull_request:
    paths:
      - 'scripts/build_metro_census_data.py'
      - '.github/workflows/metro-census.yml'
  workflow_dispatch:
  schedule:
    - cron: '15 9 1 * *'
permissions:
  contents: write
  pull-requests: write
jobs:
  census:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install openpyxl==3.1.5 pyshp==2.3.1
      - name: Download, join and validate official 2025 population estimates
        run: python scripts/build_metro_census_data.py
      - name: Upload generated dataset for validation
        uses: actions/upload-artifact@v4
        with:
          name: census-2025-metro-data
          path: |
            public/data/metros-census-2025.csv
            public/data/metros-census-2025.report.json
      - name: Propose updated Census dataset
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain public/data/metros-census-2025.csv public/data/metros-census-2025.report.json)" ]; then exit 0; fi
          BRANCH="data/refresh-census-2025"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add public/data/metros-census-2025.csv public/data/metros-census-2025.report.json
          git commit -m "data: refresh authoritative Census 2025 metro data"
          git push --force-with-lease origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" --title "Refresh 2025 Census metro populations" --body "Generated from official Census 2025 CBSA estimates and Gazetteer internal points. See public/data/metros-census-2025.report.json for unmatched records and source URLs." || true
