name: Fort Collins static lane guidance metadata
on:
  pull_request:
    paths:
      - 'scripts/road_static_lane_guidance.py'
      - 'scripts/road_guidance_way_permissions.py'
      - 'scripts/test_road_static_lane_guidance.py'
      - 'scripts/fort_collins_guidance_checkpoint.py'
      - 'scripts/fort_collins_control*.py'
      - 'scripts/road_reference*.py'
      - 'scripts/reference_via_node_compile.py'
      - 'docs/research/fort-collins-static-guidance/**'
      - 'docs/research/fort-collins-control-corpus/**'
      - '.github/workflows/fort-collins-static-guidance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-indications:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'tzdata==2026.5' 'osmium==4.3.2' 'networkx==3.7'
      - run: python -m unittest discover -s scripts -p test_road_static_lane_guidance.py -v
      - run: python scripts/fort_collins_guidance_checkpoint.py
      - run: python scripts/fort_collins_control_checkpoint.py
      - run: python scripts/las_vegas_ui_checkpoint.py --check-frozen
      - uses: actions/upload-artifact@v6
        with:
          name: fort-collins-static-guidance
          path: docs/research/fort-collins-static-guidance/
          if-no-files-found: error
