name: Fixed-reference via-node car rule selection
on:
  pull_request:
    paths:
      - 'scripts/road_reference_turn_rules.py'
      - 'scripts/test_road_reference_turn_rules.py'
      - 'scripts/reference_turn_rule_checkpoint.py'
      - 'scripts/check_reference_turn_rule_oracle.cjs'
      - 'scripts/road_reference_conditionals.py'
      - 'scripts/road_reference_scenario.py'
      - 'scripts/road_turn_aware_probe.py'
      - 'scripts/fort_collins_entry_context.py'
      - 'scripts/fort_collins_raw_context.py'
      - 'scripts/road_reference_way_permissions.py'
      - 'scripts/stream_osm_roads.py'
      - 'docs/research/fort-collins-entry-context/**'
      - 'docs/research/reference-road-scenario/scenario.json'
      - 'docs/research/reference-turn-rules/**'
      - '.github/workflows/reference-turn-rules.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  raw-rule-selection:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: python -m pip install 'tzdata==2026.5' 'osmium==4.3.2' 'networkx==3.7'
      - run: python -m unittest discover -s scripts -p test_road_reference_turn_rules.py -v
      - run: python scripts/reference_turn_rule_checkpoint.py
      - name: Compare every weekly wall-clock minute with an independent parser
        run: |
          npm install --prefix "$RUNNER_TEMP/turn-clock-oracle" --no-audit --no-fund opening_hours@3.15.0
          python scripts/reference_turn_rule_checkpoint.py --oracle-fixture /tmp/turn-rule-week.json
          TZ=UTC NODE_PATH="$RUNNER_TEMP/turn-clock-oracle/node_modules" node scripts/check_reference_turn_rule_oracle.cjs /tmp/turn-rule-week.json
      - run: python scripts/fort_collins_entry_context.py
      - run: python scripts/reference_way_permission_checkpoint.py
      - run: python scripts/reference_segment_permission_checkpoint.py
      - run: python scripts/las_vegas_ui_checkpoint.py --check-frozen
      - uses: actions/upload-artifact@v6
        with:
          name: reference-turn-rule-selection
          path: docs/research/reference-turn-rules/
          if-no-files-found: error
