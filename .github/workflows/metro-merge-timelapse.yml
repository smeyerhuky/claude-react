name: Metro map merge timelapse
on:
  pull_request_target:
    types: [closed]
    branches: [main]
    paths:
      - 'src/components/MetroPopulationVoronoi.jsx'
      - 'public/data/metros-census-2025.csv'
      - 'scripts/capture-metro.mjs'
      - 'scripts/capture-app-states.mjs'
      - 'scripts/build_metro_merge_timelapse.py'
      - '.github/workflows/metro-screenshot.yml'
      - '.github/workflows/metro-merge-timelapse.yml'
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Merged PR number to backfill (for example 65)'
        required: true
        type: number
permissions:
  contents: write
  pull-requests: write
jobs:
  merge-video:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout merged project
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify this is a merged same-repository PR into main
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_PR: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: |
          PR="$REQUESTED_PR"
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" > /tmp/metro-merged-pr.json
          jq -e --arg repo "$GITHUB_REPOSITORY" '.merged == true and .base.ref == "main" and .head.repo.full_name == $repo' /tmp/metro-merged-pr.json >/dev/null
          echo "number=$PR" >> "$GITHUB_OUTPUT"
          echo "merge_sha=$(jq -r .merge_commit_sha /tmp/metro-merged-pr.json)" >> "$GITHUB_OUTPUT"
      - name: Prepare dependencies
        run: |
          command -v ffmpeg || { sudo apt-get update -qq; sudo apt-get install -y ffmpeg; }
          git fetch origin "refs/pull/${{ steps.validate.outputs.number }}/head:refs/remotes/origin/merged-pr" || true
      - name: Build video from every PR commit snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.validate.outputs.number }}
        run: python3 scripts/build_metro_merge_timelapse.py
      - name: Publish MP4 as permanent GitHub release asset
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.validate.outputs.number }}
          MERGE_SHA: ${{ steps.validate.outputs.merge_sha }}
        run: |
          FILE="metro-timelapse/metro-pr-${PR_NUMBER}-timelapse.mp4"
          if [ ! -s "$FILE" ]; then
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TAG="metro-map-merge-pr-${PR_NUMBER}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$MERGE_SHA" --title "Metro map merge timelapse PR #${PR_NUMBER}" --notes "Timelapse from screenshot snapshots of this repository's PR commits." --latest=false
          fi
          gh release upload "$TAG" "$FILE" --clobber
          echo "published=true" >> "$GITHUB_OUTPUT"
      - name: Upload video for CI inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metro-merge-timelapse
          path: metro-timelapse/
          if-no-files-found: warn
      - name: Post closing merged-PR video comment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.validate.outputs.number }}
          MERGE_SHA: ${{ steps.validate.outputs.merge_sha }}
          PUBLISHED: ${{ steps.publish.outputs.published }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          pr = os.environ["PR_NUMBER"]
          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["MERGE_SHA"]
          path = Path("metro-timelapse/manifest.json")
          data = json.loads(path.read_text()) if path.exists() else {}
          count = data.get("commits", "unknown")
          frames = data.get("frames", 0)
          unique = data.get("unique_screenshot_versions", 0)
          video_url = f"https://github.com/{repo}/releases/download/metro-map-merge-pr-{pr}/metro-pr-{pr}-timelapse.mp4"
          run_url = f"https://github.com/{repo}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          lines = [
              "### ✅ Merged into main — map timelapse",
              f"**Merge commit:** \`{sha[:12]}\`",
              f"**PR commits:** {count} · **Commits with screenshot available:** {frames} · **Distinct screenshot versions:** {unique}",
              "**Video:** 24 fps, 0.5 seconds per commit frame.",
              (f"[▶ Watch/download the MP4 timelapse]({video_url})" if os.environ.get("PUBLISHED") == "true"
               else "Video could not be published; see workflow artifact and logs."),
              f"[Workflow run and artifacts]({run_url})",
          ]
          body = "\n\n".join(lines)
          result = subprocess.run(["gh", "api", "-X", "POST", f"repos/{repo}/issues/{pr}/comments", "--input", "-"],
                                  input=json.dumps({"body": body}), text=True, check=True, capture_output=True)
          Path("/tmp/metro-merge-summary-comment.json").write_text(result.stdout)
          PY

      - name: Post collapsible native MP4 on merged PR
        if: steps.publish.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_MEDIA_UPLOAD_TOKEN }}
          PR_NUMBER: ${{ steps.validate.outputs.number }}
        shell: bash
        run: |
          set -euo pipefail
          VIDEO="metro-timelapse/metro-pr-${PR_NUMBER}-timelapse.mp4"
          if [ -z "${GH_TOKEN:-}" ] || [ ! -s "$VIDEO" ]; then
            echo "Native media unavailable; permanent Release link posted above."
            exit 0
          fi
          echo "Metro merge timelapse native media attachment" > /tmp/timelapse-body.md
          if ! gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/timelapse-body.md --attach "$VIDEO" >/tmp/timelapse-comment-url 2>/tmp/timelapse-upload-error; then
            echo "Native video upload failed; existing Release MP4 remains available."
            cat /tmp/timelapse-upload-error
            exit 0
          fi
          URL="$(tail -n 1 /tmp/timelapse-comment-url)"
          ID="${URL##*issuecomment-}"
          [[ "$ID" =~ ^[0-9]+$ ]] || exit 0
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$ID" > /tmp/timelapse-comment.json
          python3 - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          uploaded = json.loads(Path('/tmp/timelapse-comment.json').read_text())
          original = json.loads(Path('/tmp/metro-merge-summary-comment.json').read_text())
          match = re.search(r'https://github.com/user-attachments/assets/[a-f0-9-]+', uploaded['body'])
          if not match:
              print('No native MP4 URL; keeping both comments to avoid losing the attachment')
              raise SystemExit(0)
          body = original['body'] + ('\n\n<details>\n'
                  '<summary>▶ Watch the timelapse inline</summary>\n\n'
                  + match.group(0) + '\n\n</details>\n')
          repo = os.environ['GITHUB_REPOSITORY']
          # Patch the existing summary first. Never delete the temporary upload
          # comment unless the final summary now contains the native video URL.
          subprocess.run(['gh', 'api', '-X', 'PATCH', f"repos/{repo}/issues/comments/{original['id']}",
                          '-f', f'body={body}'], check=True, stdout=subprocess.DEVNULL)
          subprocess.run(['gh', 'api', '-X', 'DELETE', f"repos/{repo}/issues/comments/{uploaded['id']}"],
                         check=True, stdout=subprocess.DEVNULL)
          PY
