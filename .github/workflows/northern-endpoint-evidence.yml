name: Independent northern endpoint source evidence
on:
  pull_request:
    paths:
      - 'scripts/*northern_endpoint_evidence.py'
      - 'docs/research/northern-endpoint-evidence/**'
      - 'docs/research/northern-local-detours/report.json'
      - '.github/workflows/northern-endpoint-evidence.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-agency-and-native-source-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'osmium==4.3.2' 'networkx==3.7' 'tzdata==2026.5' 'pyproj==3.8.0' 'openpyxl==3.1.5'
      - name: Matching, complete-query, source-code and wrong-publisher checks
        run: python -m unittest discover -s scripts -p test_northern_endpoint_evidence.py -v
      - id: source_cache
        name: Derive the existing exact original-source cache identity
        run: |
          python - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from research_source_cache import cache_key, MANIFEST
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as handle:
              handle.write('key=' + cache_key(json.loads(MANIFEST.read_text())) + '\n')
          PY
      - uses: actions/cache/restore@v4
        with:
          path: local-data/*.osm.pbf
          key: ${{ steps.source_cache.outputs.key }}
      - name: Recover the complete exact Colorado extract with read-only PR permissions
        run: python scripts/fetch_research_source.py --source colorado.osm.pbf --output local-data/colorado.osm.pbf
      - name: Re-extract the five native endpoint records from exact Colorado bytes
        run: python scripts/northern_endpoint_evidence.py --osm local-data/colorado.osm.pbf
      - name: Re-fetch all 37 public agency originals and reproduce every retained fact
        run: python scripts/northern_endpoint_evidence.py --original-dir "$RUNNER_TEMP/northern-agency-originals" --download
      - name: Preserve the historical 33-source checkpoint
        run: python scripts/las_vegas_ui_checkpoint.py --check-frozen
      - name: Retain derived facts and fresh source hashes only
        run: |
          mkdir -p /tmp/northern-endpoint-artifact
          cp docs/research/northern-endpoint-evidence/* /tmp/northern-endpoint-artifact/
          cp "$RUNNER_TEMP/northern-agency-originals/fresh-source-receipts.json" /tmp/northern-endpoint-artifact/
      - uses: actions/upload-artifact@v6
        with:
          name: northern-independent-endpoint-evidence
          path: /tmp/northern-endpoint-artifact/
          if-no-files-found: error
          retention-days: 14
