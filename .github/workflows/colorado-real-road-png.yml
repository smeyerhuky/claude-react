name: Colorado real OSM and Census research road PNGs
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/colorado-real-road-png.yml'
      - 'scripts/colorado_research_road_preview.py'
      - 'scripts/colorado_tiger2025_geography.py'
      - 'scripts/colorado_geographic_mask.py'
      - 'scripts/colorado_routed_raster_diagnostics.py'
      - 'scripts/colorado_road_png_dijkstra_oracle.py'
      - 'scripts/colorado_connector_review_queue.py'
      - 'scripts/colorado_extract_comparison.py'
      - 'scripts/colorado_competition_blockers.py'
      - 'scripts/colorado_origin_source_investigation.py'
      - 'scripts/test_colorado_origin_source_investigation.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/colorado-real-road-png.yml'
permissions:
  contents: read
jobs:
  real-source-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install real-routing and geographic inputs tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y osmium-tool
          python -m pip install 'networkx>=3.4,<4' 'osmium>=4,<5' 'scipy>=1.14,<2' 'pyshp>=2.3,<3' 'shapely>=2,<3' 'numpy>=1.26,<3' 'pillow>=10,<13'
      - uses: actions/cache@v4
        with:
          path: local-data/tiger2025
          key: tiger2025-census-2025-denver-county-water-v1
      - name: Download and filter genuine Colorado OpenStreetMap directed roads
        run: |
          set -euo pipefail
          mkdir -p local-data colorado-real-road-preview
          curl -fLSs --retry 3 --connect-timeout 20 --max-time 1200 -o local-data/colorado.osm.pbf https://download.geofabrik.de/north-america/us/colorado-latest.osm.pbf
          sha256sum local-data/colorado.osm.pbf > colorado-real-road-preview/geofabrik-source-sha256.txt
          osmium extract --bbox=-106.1,38.65,-104.5,40.1 --strategy=complete_ways local-data/colorado.osm.pbf -o local-data/corridor.osm.pbf
          osmium tags-filter local-data/corridor.osm.pbf w/highway=motorway,motorway_link,trunk,trunk_link,primary,primary_link,secondary,secondary_link,tertiary,tertiary_link,residential,unclassified,living_street,service -o local-data/roads.osm.pbf
          sha256sum local-data/roads.osm.pbf > colorado-real-road-preview/filtered-road-sha256.txt
      - name: Investigate missing metro origins directly against the original Colorado PBF
        run: |
          set -euo pipefail
          PYTHONPATH=scripts python -m unittest -v scripts/test_colorado_origin_source_investigation.py
          timeout --signal=TERM --kill-after=30s 8m python -u scripts/colorado_origin_source_investigation.py \
            --osm local-data/colorado.osm.pbf --metros public/data/metros-census-2025.csv \
            --cbsa 14500 17820 19740 22660 24540 --radius-m 20000 \
            --output colorado-real-road-preview/raw-origin-investigation.json \
            2>&1 | tee colorado-real-road-preview/raw-origin-investigation.log
          python - <<'PYCODE'
          import hashlib
          import json
          from pathlib import Path
          result = json.loads(Path("colorado-real-road-preview/raw-origin-investigation.json").read_text())
          assert result["release_eligible"] is False
          assert result["access_verified"] is False
          assert result["extract_coverage_certified"] is False
          assert result["highway_ways_with_missing_locations"] == 0
          assert [m["cbsa"] for m in result["metros"]] == ["14500", "17820", "19740", "22660", "24540"]
          for field, filename in (("osm_sha256", "local-data/colorado.osm.pbf"),
                                  ("metros_csv_sha256", "public/data/metros-census-2025.csv")):
              with Path(filename).open("rb") as handle:
                  assert result[field] == hashlib.file_digest(handle, "sha256").hexdigest()
          # Non-vacuous data scan; a road lead remains unapproved evidence.
          assert all(m["nearest_mapped_highway"] is not None for m in result["metros"])
          assert all(m["nearest_model_drivable_highway"] is not None for m in result["metros"])
          PYCODE
      - name: Prepare official Census TIGER2025 land and county water sources
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 15m python -u scripts/colorado_tiger2025_geography.py \
            --bbox -105.1 39.65 -104.85 39.90 \
            --cache local-data/tiger2025 --output-dir colorado-real-road-preview/tiger2025 \
            2>&1 | tee colorado-real-road-preview/tiger-source.log
      - name: Generate research-only real-world distance and travel-time PNGs
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 12m python -u scripts/colorado_research_road_preview.py \
            --osm local-data/roads.osm.pbf --metros public/data/metros-census-2025.csv \
            --land-geojson colorado-real-road-preview/tiger2025/tiger2025-colorado-land.geojson \
            --water-geojson colorado-real-road-preview/tiger2025/tiger2025-colorado-areawater.geojson \
            --bounds -105.060 39.732 -105.020 39.762 \
            --threshold 100000 --pixels 64 --max-gap-m 30 \
            --output-dir colorado-real-road-preview/routed-layers \
            2>&1 | tee colorado-real-road-preview/routed-preview.log
      - name: Independently check PNG alpha against real Census polygons
        run: |
          set -euo pipefail
          PYTHONPATH=scripts python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          from colorado_geographic_mask import build_explicit_land_water_mask
          base = Path("colorado-real-road-preview")
          src = base / "tiger2025"
          out = base / "routed-layers"
          summary = json.loads((out / "preview-manifest.json").read_text())
          assert summary["release_eligible"] is False
          assert summary["access_certified"] is False
          assert summary["extract_coverage_certified"] is False
          assert summary["land_water_completeness_certified"] is False
          assert summary["source_cbsa_count"] > 0
          mask = build_explicit_land_water_mask(
              src / "tiger2025-colorado-land.geojson",
              src / "tiger2025-colorado-areawater.geojson",
              summary["bounds_lonlat"], 64, 64)
          # Avoid a vacuous water test: the viewport includes Sloan's Lake.
          assert mask["pixel_counts"]["water_excluded"] > 0, (
              "No Census water pixels in preview; water-exclusion test would be vacuous")
          reports = {}
          for metric in ("distance", "time"):
              entry = summary["layers"][metric]
              with Image.open(out / entry["image"]) as image:
                  image.load()
                  assert image.size == (64, 64) and image.mode == "RGBA"
                  nonzero = 0
                  transparent = 0
                  for y, row in enumerate(mask["land_mask"]):
                      for x, is_land in enumerate(row):
                          alpha = image.getpixel((x, y))[3]
                          if not is_land:
                              assert alpha == 0, "Water/off-land pixel incorrectly shaded"
                          nonzero += alpha > 0
                          transparent += alpha == 0
              assert nonzero > 0, "Real-world road-region preview has no routed samples"
              assert transparent > 0, "Real-world preview has no transparent unsupported samples"
              assert entry["reason_counts"].get("routed_candidate", 0) == nonzero
              reports[metric] = {"routed_pixels": nonzero,
                                 "transparent_pixels": transparent}
          (base / "alpha-verification.json").write_text(json.dumps({
              "status": "research-only-verified-alpha-not-physical-access",
              "release_eligible": False,
              "geography_pixel_counts": mask["pixel_counts"],
              "metrics": reports,
          }, indent=2) + "\n")
          print(json.dumps(reports, indent=2))
          PY
      - name: Independent Dijkstra verification of real Colorado PNG winner pixels
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 10m python -u scripts/colorado_road_png_dijkstra_oracle.py \
            --osm local-data/roads.osm.pbf \
            --metros public/data/metros-census-2025.csv \
            --preview-dir colorado-real-road-preview/routed-layers \
            --max-samples 8 \
            --output colorado-real-road-preview/dijkstra-oracle.json \
            2>&1 | tee colorado-real-road-preview/dijkstra-oracle.log
      - name: Generate real OSM candidate queue for independent access reviewers
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 10m python -u scripts/colorado_connector_review_queue.py \
            --osm local-data/roads.osm.pbf --metros public/data/metros-census-2025.csv \
            --threshold 100000 --max-gap-m 100 --per-metro 4 \
            --output colorado-real-road-preview/connector-review-queue.json \
            2>&1 | tee colorado-real-road-preview/connector-review-queue.log
      - name: Compare bounded expanded Colorado road extract with baseline
        run: |
          set -euo pipefail
          osmium extract --bbox=-106.5,38.3,-104.0,40.6 --strategy=complete_ways local-data/colorado.osm.pbf -o local-data/expanded-corridor.osm.pbf
          osmium tags-filter local-data/expanded-corridor.osm.pbf w/highway=motorway,motorway_link,trunk,trunk_link,primary,primary_link,secondary,secondary_link,tertiary,tertiary_link,residential,unclassified,living_street,service -o local-data/expanded-roads.osm.pbf
          sha256sum local-data/expanded-roads.osm.pbf > colorado-real-road-preview/expanded-road-sha256.txt
          timeout --signal=TERM --kill-after=30s 12m python -u scripts/colorado_extract_comparison.py \
            --baseline-osm local-data/roads.osm.pbf \
            --expanded-osm local-data/expanded-roads.osm.pbf \
            --metros public/data/metros-census-2025.csv \
            --output colorado-real-road-preview/extract-comparison.json \
            2>&1 | tee colorado-real-road-preview/extract-comparison.log
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("colorado-real-road-preview/extract-comparison.json").read_text())
          assert result["release_eligible"] is False
          assert result["access_certified"] is False
          assert result["extract_coverage_certified"] is False
          assert result["qualifying_cbsa_count"] == 359, "Unexpected qualifying metro inventory"
          for cbsa in ("14500", "17820"):
              row = next(x for x in result["metros"] if x["cbsa"] == cbsa)
              print(json.dumps(row, sort_keys=True))
          PY
      - name: Inventory complete-source blockers from real expanded OSM comparison
        run: |
          set -euo pipefail
          python scripts/colorado_competition_blockers.py \
            --comparison colorado-real-road-preview/extract-comparison.json \
            --output colorado-real-road-preview/competition-blockers.json
          python - <<'PY'
          import json
          from pathlib import Path
          b = json.loads(Path("colorado-real-road-preview/competition-blockers.json").read_text())
          assert b["release_eligible"] is False
          assert b["directed_global_competition_testable"] is False
          assert b["qualifying_cbsa_count"] == 359
          assert b["expanded_geometric_candidate_cbsa_count"] + b["missing_geometric_candidate_cbsa_count"] == 359
          assert len(b["missing_geometric_candidate_cbsa_ids"]) == b["missing_geometric_candidate_cbsa_count"]
          PY
      - name: Reject unapproved evidence and cross-source manifest mismatches
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path
          base = Path("colorado-real-road-preview")
          png = json.loads((base/"routed-layers/preview-manifest.json").read_text())
          oracle = json.loads((base/"dijkstra-oracle.json").read_text())
          queue = json.loads((base/"connector-review-queue.json").read_text())
          assert oracle["release_eligible"] is False
          assert oracle["access_certified"] is False
          assert all(x["disagreements"] == 0 and x["sampled_colored_pixels"] > 0
                     for x in oracle["metrics"].values())
          assert queue["release_eligible"] is False
          assert queue["access_verified"] is False
          assert queue["approval_or_evidence"] is False
          assert all(entry["access_verified"] is False for entry in queue["candidates"])
          # Count-only checks cannot detect a substituted or omitted CBSA.
          # Independently rebuild the full qualifying inventory from the exact CSV.
          with Path("public/data/metros-census-2025.csv").open(
                  newline="", encoding="utf-8") as handle:
              eligible = [row["cbsa"] for row in csv.DictReader(handle)
                          if int(row["population"]) >= png["source_population_threshold"]]
          queue_ids = [entry["cbsa"] for entry in queue["candidates"]]
          assert len(eligible) == len(set(eligible)), "Duplicate qualifying Census CBSA"
          assert len(queue_ids) == len(set(queue_ids)), "Duplicate queued CBSA"
          assert set(queue_ids) == set(eligible), "Incomplete or substituted CBSA audit queue"
          assert queue["threshold_population"] == png["source_population_threshold"]
          assert queue["eligible_metros_including_missing_candidates"] == len(eligible)
          assert len(png["source_cbsa_ids"]) == png["source_cbsa_count"]
          assert len(set(png["source_cbsa_ids"])) == png["source_cbsa_count"]
          assert set(png["source_cbsa_ids"]).issubset(set(eligible))
          assert queue["metros_with_geometric_candidates"] == sum(
              entry["candidate_count_within_limit"] > 0 for entry in queue["candidates"])
          assert queue["metros_without_geometric_candidates"] == sum(
              entry["candidate_count_within_limit"] == 0 for entry in queue["candidates"])
          assert queue["osm_sha256"] == png["osm_sha256"]
          assert queue["metros_csv_sha256"] == png["metro_csv_sha256"]
          print(json.dumps({"dijkstra_samples": {
              k: v["sampled_colored_pixels"] for k, v in oracle["metrics"].items()},
              "audit_candidate_metros": queue["metros_with_geometric_candidates"],
              "audit_missing_metros": queue["metros_without_geometric_candidates"]}, indent=2))
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: colorado-real-source-road-region-pngs
          path: colorado-real-road-preview/
          retention-days: 14
