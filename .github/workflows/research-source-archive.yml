name: Pinned research source archive
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/research-source-archive.yml'
      - 'scripts/research-source-snapshots/**'
      - 'docs/research-source-archive.md'
permissions:
  contents: read
jobs:
  validate-manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Validate fixed source inventory and fetch small checksum probes
        run: |
          python3 - <<'PY'
          import hashlib, json, re, urllib.parse, urllib.request
          from pathlib import Path
          m=json.loads(Path("scripts/research-source-snapshots/co-nm-az-20261027.json").read_text())
          assert m["schema"]=="research-original-source-archive-v1"
          assert m["draft_release_id"]==426327474
          assert m["draft_release_tag"]=="research-sources-20261027-co-nm-az-v1"
          for flag in ("release_eligible","access_certified","road_coverage_certified","land_water_completeness_certified","geographic_accuracy_certified","complete_global_competition"):
              assert m[flag] is False
          assert m["manifest_revision"]==5
          assert len(m["files"])==len({x["filename"] for x in m["files"]})==21
          assert sum(x["bytes"] for x in m["files"])<2_200_000_000
          for entry in m["files"]:
              name=entry["filename"]
              assert Path(name).name==name and name not in (".","..")
              assert re.fullmatch(r"[a-zA-Z0-9_.-]+",name)
              assert re.fullmatch(r"[a-f0-9]{64}",entry["sha256"])
              assert type(entry["bytes"]) is int and 0<entry["bytes"]<2_000_000_000
              u=urllib.parse.urlsplit(entry["source_url"])
              assert u.scheme=="https" and u.hostname in {"download.geofabrik.de","www2.census.gov","raw.githubusercontent.com"}
              assert not u.username and not u.password and not u.port and not u.fragment
              if name in ("population.xlsx","metros-census-2025.csv","2025_gaz_place_08.txt"):
                  with urllib.request.urlopen(entry["source_url"],timeout=60) as response:
                      data=response.read(entry["bytes"]+1)
                  assert len(data)==entry["bytes"] and hashlib.sha256(data).hexdigest()==entry["sha256"]
          print("Twenty-one pinned original inputs validated; all three small remote checksum probes passed")
          PY
  retain-draft-assets:
    if: github.event_name == 'workflow_dispatch'
    needs: validate-manifest
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Retain verified original bytes in the existing draft without publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, shutil, subprocess
          from pathlib import Path
          assert os.environ["GITHUB_REPOSITORY"]=="smeyerhuky/claude-react"
          repo="smeyerhuky/claude-react"
          manifest_path=Path("scripts/research-source-snapshots/co-nm-az-20261027.json")
          m=json.loads(manifest_path.read_text())
          root=Path(os.environ["RUNNER_TEMP"])/"research-source-archive"
          root.mkdir()
          def release():
              r=json.loads(subprocess.check_output(["gh","api",f"repos/{repo}/releases/{m['draft_release_id']}"]))
              if r["draft"] is not True or r["tag_name"]!=m["draft_release_tag"]:
                  raise ValueError("Expected existing draft; never publish or modify a published release")
              return r
          release()
          for entry in m["files"]:
              path=root/entry["filename"]
              print("Acquiring pinned source",path.name,flush=True)
              subprocess.run(["curl","-fLSs","--retry","3","--connect-timeout","20","--max-time","1200",
                              "--output",str(path),entry["source_url"]],check=True)
              with path.open("rb") as f:
                  digest=hashlib.file_digest(f,"sha256").hexdigest()
              if digest!=entry["sha256"] or path.stat().st_size!=entry["bytes"]:
                  raise ValueError("Source bytes changed; do not alter expected checksums")
          shutil.copyfile(manifest_path,root/"source-manifest-v5.json")
          shutil.copyfile("docs/research-source-archive.md",root/"README-v5.md")
          (root/"SHA256SUMS-v5").write_text("".join(x["sha256"]+"  "+x["filename"]+"\n" for x in m["files"]))
          paths=[root/x["filename"] for x in m["files"]]+[root/n for n in ("source-manifest-v5.json","README-v5.md","SHA256SUMS-v5")]
          verified=[]
          for path in paths:
              with path.open("rb") as f:
                  digest="sha256:"+hashlib.file_digest(f,"sha256").hexdigest()
              r=release()
              matches=[a for a in r["assets"] if a["name"]==path.name]
              if not matches:
                  subprocess.run(["gh","release","upload",m["draft_release_tag"],str(path),"--repo",repo],check=True)
                  matches=[a for a in release()["assets"] if a["name"]==path.name]
              if (len(matches)!=1 or matches[0]["state"]!="uploaded" or
                      matches[0]["size"]!=path.stat().st_size or matches[0].get("digest")!=digest):
                  raise ValueError("Retained asset digest/state mismatch; never clobber existing assets")
              verified.append({"name":path.name,"id":matches[0]["id"],"bytes":matches[0]["size"],"digest":digest})
              print("Verified draft asset",path.name,digest,flush=True)
          release()
          (root/"archive-verification.json").write_text(json.dumps({"draft":True,"release_id":m["draft_release_id"],
              "release_eligible":False,"assets":verified},indent=2)+"\n")
          PY
      - uses: actions/upload-artifact@v6
        with:
          name: pinned-source-archive-verification
          path: ${{ runner.temp }}/research-source-archive/archive-verification.json
