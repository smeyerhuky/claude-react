name: Bounded boundary-label routing experiment
on:
  pull_request:
    paths:
      - 'scripts/six_state_checkpoint.py'
      - 'scripts/metro_scenario_checkpoint.py'
      - 'scripts/road_primitive_sparse.py'
      - 'scripts/stream_osm_roads.py'
      - 'scripts/colorado_raw_boundary_interfaces.py'
      - 'scripts/road_source_fingerprint_store.py'
      - 'scripts/road_partition_oracle.py'
      - 'scripts/colorado_expanded_parent_competition.py'
      - 'scripts/colorado_exterior_parent_competition.py'
      - 'scripts/colorado_adjacent_source_interfaces.py'
      - 'scripts/research-source-snapshots/**'
      - 'docs/research/census-31-source-checkpoint/**'
      - 'docs/research/census-26-source-checkpoint/**'
      - 'docs/research/utah-parent-reference/domains.json'
      - 'scripts/road_boundary_label_oracle.py'
      - 'scripts/test_road_boundary_label_oracle.py'
      - 'scripts/kansas_two_partition_competition.py'
      - 'scripts/road_query_leaf_core.py'
      - 'scripts/road_longitude_partition.py'
      - 'docs/boundary-label-routing.md'
      - '.github/workflows/boundary-label-routing.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  six-state-fixed-point:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'networkx>=3.4,<4' 'osmium>=4,<5' 'scipy>=1.14,<2'
      - run: PYTHONPATH=scripts python -m unittest -v scripts/test_road_boundary_label_oracle.py scripts/test_road_partition_oracle.py
      - name: Acquire six exact dated inputs
        run: |
          for state in colorado new-mexico arizona utah oklahoma kansas; do
            curl --fail --location --retry 3 --max-time 600 "https://download.geofabrik.de/north-america/us/$state-261027.osm.pbf" --output "$state.osm.pbf"
          done
      - name: Converge every query and replay all finite native paths
        run: |
          set -o pipefail
          mkdir -p result
          python -u scripts/kansas_two_partition_competition.py --solver boundary-label-v1 --parent-osm colorado.osm.pbf new-mexico.osm.pbf arizona.osm.pbf utah.osm.pbf oklahoma.osm.pbf kansas.osm.pbf --output result/report.json 2>&1 | tee result/routing.log
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('result/report.json').read_text())
          assert r['solver_policy']=='boundary-label-v1'
          assert r['source_costs_computed']==2232 and r['retained_costs_compared']==1872 and r['new_source_costs_computed']==360
          assert len(r['sources'])==31 and len(r['comparisons'])==72
          assert len(r['unrepresented_source_qualifying_cbsa_ids'])==336 and len(r['source_qualifying_cbsa_ids'])==367
          assert sum(r['retained_cost_comparison_statuses'].values())==1872
          old={s['cbsa']:s for s in json.loads(Path('docs/research/census-26-source-checkpoint/baseline.json').read_text())['sources']}
          assert all(s['retained_reference_record']==old[s['cbsa']] for s in r['sources'] if s['cbsa'] in old)
          assert r['interface_audit']['boundary_vertex_count']==178 and r['interface_audit']['boundary_vertex_limit']==192
          assert r['interface_audit']['dense_port_closure_constructed'] is False
          assert r['interface_audit']['flattened_road_union_constructed'] is False
          assert r['full_model_union_nodes']==22027949
          assert all(g['nodes']<=15000000 and g['directed_primitive_arcs']<=40000000 for g in r['partition_graphs']+r['full_partition_graphs'])
          for run in r['local_oracle_runs']:
              assert run['solver_policy']=='two-shard-boundary-label-fixed-point-v1' and run['converged'] is True
              assert run['dense_overlay_constructed'] is False and run['auxiliary_nodes_per_shard']==1
              assert run['local_dijkstra_calls']<=512 and run['local_dijkstra_calls']==run['propagation_dijkstra_calls']+run['replay_dijkstra_calls']
              assert max(run['working_shard_nodes'])<=15000000 and max(run['working_shard_arcs'])<=40000000
              assert all(s['converged'] is True for s in run['fixed_point_sweeps'])
          finite=sum(v['graph_only_cost'] is not None for row in r['comparisons'] for v in row['source_costs'])
          assert finite==r['finite_queries_replayed']==sum(run['finite_queries_replayed'] for run in r['local_oracle_runs'])
          assert r['applied_source_exclusions']==[]
          assert all(s['access_verified'] is False and s['connector_costs_included'] is False for s in r['sources'])
          for flag in ('release_eligible','access_certified','road_coverage_certified','complete_global_competition','parent_exterior_coverage_certified','datum_alignment_verified'):
              assert r[flag] is False
          PY
      - name: Preserve the separate 31-source checkpoint
        run: python scripts/six_state_checkpoint.py result/report.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: six-state-boundary-label-routing
          path: result/
          retention-days: 14
