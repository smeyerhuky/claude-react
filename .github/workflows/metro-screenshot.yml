name: Metro Map Screenshot
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: read
jobs:
  screenshot:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - run: yarn add --dev --ignore-scripts --no-lockfile playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Serve preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/metro-preview.log 2>&1 &
          for i in $(seq 1 40); do
            curl --silent --fail http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done
      - name: Visual test and screenshot
        run: node scripts/capture-metro.mjs
      - name: Commit latest baseline screenshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/metro-default.png
          if ! git diff --cached --quiet; then
            git commit -m "test: update metro default screenshot [skip ci]"
            git push
          fi
