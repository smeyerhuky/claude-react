name: Metro Map Screenshot
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'src/components/MetroPopulationVoronoi.jsx'
      - 'public/data/metros-census-2025.csv'
      - 'scripts/capture-metro.mjs'
      - 'scripts/capture-app-states.mjs'
      - 'scripts/verify-metro-export.mjs'
      - 'scripts/build_metro_merge_timelapse.py'
      - '.github/workflows/metro-screenshot.yml'
      - '.github/workflows/metro-merge-timelapse.yml'
  push:
    branches: [main]
    paths:
      - 'src/components/MetroPopulationVoronoi.jsx'
      - 'public/data/metros-census-2025.csv'
      - 'scripts/capture-metro.mjs'
      - 'scripts/capture-app-states.mjs'
      - 'scripts/verify-metro-export.mjs'
      - 'scripts/build_metro_merge_timelapse.py'
      - '.github/workflows/metro-screenshot.yml'
      - '.github/workflows/metro-merge-timelapse.yml'
  workflow_dispatch:
concurrency:
  group: metro-visual-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
  pull-requests: write
jobs:
  screenshot:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - name: Allow Git operations in container checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: corepack enable
      - name: Restore installed dependency cache
        id: modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: metro-node22-playwright1.56.1-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
      - name: Install dependencies and screenshot driver on cache miss
        if: steps.modules.outputs.cache-hit != 'true'
        run: |
          start=$SECONDS
          yarn install --frozen-lockfile --prefer-offline
          yarn add --dev --ignore-scripts --no-lockfile playwright@1.56.1
          echo "Dependency installation (cache miss): $((SECONDS-start))s" >> "$GITHUB_STEP_SUMMARY"
      - name: Report dependency cache result
        run: |
          echo "Installed dependency cache: ${{ steps.modules.outputs.cache-hit == 'true' && 'HIT' || 'MISS' }}" >> "$GITHUB_STEP_SUMMARY"
      - run: npm run build
      - name: Serve preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/metro-preview.log 2>&1 &
          for i in $(seq 1 40); do
            curl --silent --fail http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done
      - name: Visual test and screenshot
        id: visual
        run: node scripts/capture-metro.mjs
      - name: Verify exported PNG visual composition
        id: export_visual
        if: success()
        run: node scripts/verify-metro-export.mjs
      - name: Capture full application visual states
        id: app_visual
        if: success()
        run: node scripts/capture-app-states.mjs
      - name: Report visual test timings
        if: always()
        shell: bash
        run: |
          echo "### Metro visual test results" >> "$GITHUB_STEP_SUMMARY"
          echo "Map-only regression: ${{ steps.visual.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Exported PNG composition: ${{ steps.export_visual.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Full-app captures: ${{ steps.app_visual.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -f docs/screenshots/visual-manifest.json ]; then
            node --input-type=module -e '
              import fs from "node:fs";
              const states = JSON.parse(fs.readFileSync("docs/screenshots/visual-manifest.json")).states;
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, [
                "",
                "| Viewport | Map ready | Capture | Fits viewport |",
                "|---|---:|---:|---|",
                ...states.map(s => `| ${s.name} | ${s.mapReadyMs ?? "—"} ms | ${s.captureMs ?? "—"} ms | ${s.horizontalFit && s.verticalFit ? "Yes" : "No"} |`),
              ].join("\n") + "\n");
            '
          fi
      - name: Upload screenshot even when validation fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metro-debug-screenshot
          path: |
            docs/screenshots/*.png
            docs/screenshots/visual-manifest.json
            docs/screenshots/export-visual-manifest.json
          if-no-files-found: warn
      - name: Commit latest screenshot (pass or fail)
        id: screenshot_commit
        if: always() && github.event_name == 'pull_request'
        shell: bash
        run: |
          IMAGE=docs/screenshots/metro-default.png
          if [ -f "$IMAGE" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/screenshots/*.png
            if ! git diff --cached --quiet; then
              git commit -m "test: update metro screenshot [skip ci]"
              git push
            fi
            echo "image_present=true" >> "$GITHUB_OUTPUT"
            echo "image_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          else
            echo "image_present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Comment with screenshot on every PR push
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          VISUAL_RESULT: ${{ steps.visual.outcome }}
          IMAGE_PRESENT: ${{ steps.screenshot_commit.outputs.image_present }}
          IMAGE_SHA: ${{ steps.screenshot_commit.outputs.image_sha }}
          APP_RESULT: ${{ steps.app_visual.outcome }}
          EXPORT_RESULT: ${{ steps.export_visual.outcome }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo
            const issue_number = context.issue.number
            const result = process.env.VISUAL_RESULT || 'not run'
            const status = result === 'success' ? '✅ PASS' : '❌ FAIL'
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`
            const imageUrl = process.env.IMAGE_PRESENT === 'true'
              ? `https://raw.githubusercontent.com/${owner}/${repo}/${process.env.IMAGE_SHA}/docs/screenshots/metro-default.png`
              : null
            const head = context.payload.pull_request.head.sha.slice(0, 12)
            const gallery = process.env.IMAGE_PRESENT === 'true'
              ? ['desktop-home', 'mobile-home', 'pins-one-expanded', 'pins-two-collapsed', 'pins-three-expanded', 'pins-four-scrolled', 'pins-six-scrolled-expanded'].map(name => `![${name}](https://raw.githubusercontent.com/${owner}/${repo}/${process.env.IMAGE_SHA}/docs/screenshots/${name}.png)`).join('\n\n')
              : 'Full-app screenshots unavailable; see artifact/logs.'
            const exportGallery = process.env.IMAGE_PRESENT === 'true' && process.env.EXPORT_RESULT === 'success'
              ? ['metro-export-default', 'metro-export-denver-selected', 'metro-export-six-pins'].map(name => `![${name}](https://raw.githubusercontent.com/${owner}/${repo}/${process.env.IMAGE_SHA}/docs/screenshots/${name}.png)`).join('\n\n')
              : 'Export images unavailable or visual checks failed; inspect artifact/logs.'
            const body = [
              `### Metro map screenshot — ${status}`,
              `**Push:** \`${head}\` · **Run:** [#${context.runNumber}](${runUrl})`,
              '**Preset:** 1.2M population',
              `**Full-app visual capture:** ${process.env.APP_RESULT === 'success' ? '✅ PASS' : '❌ FAIL/NOT RUN'}`, 
              gallery,
              `**Exported PNG pixel inspection:** ${process.env.EXPORT_RESULT === 'success' ? '✅ PASS' : '❌ FAIL/NOT RUN'}`,
              exportGallery,
              imageUrl ? `![Map-only regression — ${status}](${imageUrl})` : 'No map-only screenshot was captured.',
              `[Download workflow screenshot artifact](${runUrl}#artifacts)`,
              '_New comment for this push; previous screenshots remain in PR history._',
            ].join('\n\n')
            await github.rest.issues.createComment({
              owner, repo, issue_number, body,
            })
