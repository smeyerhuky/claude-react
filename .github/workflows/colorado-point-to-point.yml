name: Colorado point-to-point routing (manual)
on:
  workflow_dispatch:
    inputs:
      origins:
        description: Deterministic origin count
        default: '24'
        required: true
      destinations:
        description: Random destinations per origin (both directions checked)
        default: '8'
        required: true
permissions:
  contents: read
jobs:
  point_to_point:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y osmium-tool
          python -m pip install 'networkx>=3.4,<4' 'osmium>=4,<5'
      - name: Download and extract Colorado roads
        run: |
          set -euo pipefail
          mkdir -p local-data
          curl -fLSs --retry 3 --connect-timeout 20 --max-time 1200 -o local-data/colorado.osm.pbf 'https://download.geofabrik.de/north-america/us/colorado-latest.osm.pbf'
          sha256sum local-data/colorado.osm.pbf > local-data/source-sha256.txt
          osmium extract --bbox=-105.35,38.65,-104.5,40.05 --strategy=complete_ways local-data/colorado.osm.pbf -o local-data/corridor.osm.pbf
          osmium tags-filter local-data/corridor.osm.pbf w/highway=motorway,motorway_link,trunk,trunk_link,primary,primary_link,secondary,secondary_link,tertiary,tertiary_link,residential,unclassified,living_street,service -o local-data/roads.osm.pbf
      - name: Run synthetic directed regression tests
        run: |
          PYTHONPATH=scripts python -m unittest discover -s scripts -p 'test_*roads.py' -v
          PYTHONPATH=scripts python -m unittest discover -s scripts -p 'test_colorado_point_to_point.py' -v
      - name: Benchmark directed point-to-point routes and assert equivalence
        run: |
          set -euo pipefail
          mkdir -p road-point-to-point
          cp local-data/source-sha256.txt road-point-to-point/
          python -u scripts/benchmark_colorado_point_to_point.py --mode compressed --osm local-data/roads.osm.pbf --pairs road-point-to-point/pairs.json --output road-point-to-point/compressed.json --origins ${{ inputs.origins }} --destinations ${{ inputs.destinations }} 2>&1 | tee road-point-to-point/compressed.log
          python -u scripts/benchmark_colorado_point_to_point.py --mode reference --osm local-data/roads.osm.pbf --pairs road-point-to-point/pairs.json --output road-point-to-point/reference.json 2>&1 | tee road-point-to-point/reference.log
          python -u scripts/benchmark_colorado_point_to_point.py --compare road-point-to-point/reference.json road-point-to-point/compressed.json --output road-point-to-point/equivalence.json 2>&1 | tee road-point-to-point/equivalence.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: colorado-point-to-point-evidence
          path: road-point-to-point/
          retention-days: 14
