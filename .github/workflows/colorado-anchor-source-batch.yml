name: Colorado municipal anchor source screening
on:
  pull_request:
    paths:
      - 'docs/research/colorado-anchor-source-batch/**'
      - 'scripts/colorado_anchor_source_batch.py'
      - 'scripts/test_colorado_anchor_source_batch.py'
      - '.github/workflows/colorado-anchor-source-batch.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts -p test_colorado_anchor_source_batch.py -v
      - run: python scripts/colorado_anchor_source_batch.py
