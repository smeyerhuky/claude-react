name: Sync Census PR with main
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - 'src/components/MetroPopulationVoronoi.jsx'
      - 'scripts/capture-metro.mjs'
      - 'scripts/build_metro_census_data.py'
      - 'public/data/metros-census-2025.csv'
      - '.github/workflows/sync-census-main.yml'
permissions:
  contents: write
jobs:
  sync:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'data/real-census-metro-2025'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Merge latest main into Census PR
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "PR already includes main"
          else
            git merge --no-edit -X ours origin/main
            git push origin HEAD:"${{ github.head_ref }}"
          fi
