name: Explicit numeric posted-sign speed metadata profile
on:
  pull_request:
    paths:
      - 'scripts/road_posted_speed*.py'
      - 'scripts/fort_collins_posted_speed_checkpoint.py'
      - 'scripts/test_road_posted_speed.py'
      - 'scripts/road_guidance*.py'
      - 'scripts/road_static_lane_guidance.py'
      - 'scripts/guidance_via_node_compile.py'
      - 'scripts/fort_collins_guidance*.py'
      - 'scripts/road_reference*.py'
      - 'scripts/reference_via*.py'
      - 'scripts/road_maneuver_probe.py'
      - 'docs/research/fort-collins-posted-speed/**'
      - 'docs/research/fort-collins-guidance-road-frontier/**'
      - '.github/workflows/fort-collins-posted-speed.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  posted-numeric-sign:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'tzdata==2026.5' 'osmium==4.3.2' 'networkx==3.7'
      - run: python -m unittest discover -s scripts -p test_road_posted_speed.py -v
      - run: python scripts/fort_collins_posted_speed_checkpoint.py
      - run: python scripts/fort_collins_guidance_frontier_checkpoint.py
      - run: python scripts/las_vegas_ui_checkpoint.py --check-frozen
      - uses: actions/upload-artifact@v6
        with:
          name: fort-collins-posted-speed
          path: docs/research/fort-collins-posted-speed/
          if-no-files-found: error
