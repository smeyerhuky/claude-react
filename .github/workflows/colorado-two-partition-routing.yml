name: Colorado two-partition routing research
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/colorado-two-partition-routing.yml'
      - 'scripts/road_partition_oracle.py'
      - 'scripts/test_road_partition_oracle.py'
      - 'scripts/colorado_two_partition_competition.py'
      - 'scripts/test_colorado_two_partition_competition.py'
      - 'docs/research/oklahoma-partition-reference/**'
      - 'docs/research/utah-parent-reference/domains.json'
      - 'scripts/colorado_exterior_parent_competition.py'
      - 'scripts/colorado_expanded_parent_competition.py'
      - 'scripts/colorado_sparse_parent_oracle.py'
      - 'scripts/road_primitive_sparse.py'
      - 'scripts/stream_osm_roads.py'
      - 'scripts/colorado_adjacent_source_interfaces.py'
      - 'scripts/colorado_raw_boundary_interfaces.py'
      - 'scripts/colorado_neighbor_metro_competition.py'
      - 'scripts/colorado_metro_winners.py'
      - 'scripts/colorado_utah_exterior_competition.py'
      - 'public/data/metros-census-2025.csv'
permissions:
  contents: read
jobs:
  two-shard-paths:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'networkx>=3.4,<4' 'osmium>=4,<5' 'scipy>=1.14,<2'
      - name: Check independent union costs, repeated excursions and invalid inputs
        run: PYTHONPATH=scripts python -m unittest -v scripts/test_road_partition_oracle.py scripts/test_colorado_two_partition_competition.py
      - name: Acquire exact dated sources without accepting changed bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PYSOURCES'
          from pathlib import Path
          import json, subprocess, sys
          sys.path.insert(0,"scripts")
          from colorado_two_partition_competition import digest, load_reference
          m,_,_=load_reference()
          root=Path("local-data");root.mkdir(exist_ok=True)
          archive_id=json.loads(Path("scripts/research-source-snapshots/co-nm-az-20261027.json").read_text())["draft_release_id"]
          response=subprocess.run(["gh","api",f"repos/smeyerhuky/claude-react/releases/{archive_id}"],capture_output=True,text=True)
          assets=json.loads(response.stdout)["assets"] if response.returncode==0 else []
          if response.returncode:
              print("Archive is unavailable to this read-only job; using checksum-pinned dated provider files",flush=True)
          for s in m["source_provenance"]:
              name=s["name"]
              date=s["replication_timestamp"].split("T")[0].replace("-","")[2:]
              url="https://download.geofabrik.de/north-america/us/"+name.removesuffix(".osm.pbf")+"-"+date+".osm.pbf"
              target=root/name
              matches=[a for a in assets if a["name"]==name]
              restored=False
              if matches:
                  if len(matches)!=1 or matches[0]["state"]!="uploaded" or matches[0]["size"]!=s["size_bytes"] or matches[0].get("digest")!="sha256:"+s["sha256"]:
                      raise ValueError("Retained source metadata mismatch; never substitute changed bytes")
                  with target.open("wb") as f:
                      result=subprocess.run(["gh","api","--header","Accept: application/octet-stream",f"repos/smeyerhuky/claude-react/releases/assets/{matches[0]['id']}"],stdout=f,stderr=subprocess.PIPE)
                  restored=result.returncode==0
              if not restored:
                  subprocess.run(["curl","-fLSs","--retry","3","--connect-timeout","20","--max-time","1200","--output",str(target),url],check=True)
              if target.stat().st_size!=s["size_bytes"] or digest(target)!=s["sha256"]:
                  raise ValueError("Exact dated source mismatch; do not rewrite hashes or substitute latest")
              print("Verified source",name,"archive" if restored else "dated provider",s["sha256"],flush=True)
          PYSOURCES
      - name: Reproduce 1080 retained costs and replay two-shard routes
        run: |
          set -euo pipefail
          mkdir -p two-partition-routing
          timeout --signal=TERM --kill-after=30s 70m python -u scripts/colorado_two_partition_competition.py \
            --metros public/data/metros-census-2025.csv \
            --parent-osm local-data/colorado.osm.pbf local-data/new-mexico.osm.pbf local-data/arizona.osm.pbf local-data/utah.osm.pbf local-data/oklahoma.osm.pbf \
            --output two-partition-routing/report.json \
            2>&1 | tee two-partition-routing/routing.log
          python - <<'PYCHECK'
          import json
          from pathlib import Path
          r=json.loads(Path("two-partition-routing/report.json").read_text())
          assert len(r["source_qualifying_cbsa_ids"])==367
          assert len(r["diagnostic_source_cbsa_ids"])==26
          assert len(r["unrepresented_source_qualifying_cbsa_ids"])==341
          assert r["source_costs_computed"]==1872 and len(r["comparisons"])==72
          assert r["original_prefix_costs_reproduced"]==1080
          finite=sum(o["graph_only_cost"] is not None for c in r["comparisons"] for o in c["source_costs"])
          assert r["finite_queries_replayed"]==finite
          assert sum(run["finite_queries_replayed"] for run in r["local_oracle_runs"])==finite
          assert len(r["local_oracle_runs"])==4
          assert all(run["local_dijkstra_calls"]<=512 and run["overlay_nodes"]<=192 for run in r["local_oracle_runs"])
          audit=r["interface_audit"]
          assert audit["flattened_road_union_constructed"] is False
          assert audit["conceptual_union_nodes"]==18740644 and audit["shared_vertices"]==1443
          assert 0<len(audit["interface_ports"])<=37
          assert audit["prefix_inbound_directed_pairs"]==audit["prefix_outbound_directed_pairs"]==51
          assert [g["nodes"] for g in r["partition_graphs"]]==[14725537,4016550]
          assert all(g["nodes"]<=15000000 and g["directed_primitive_arcs"]<=40000000 for g in r["partition_graphs"])
          assert all(len(c["source_costs"])==26 for c in r["comparisons"])
          assert all(s["access_verified"] is False and s["connector_costs_included"] is False for s in r["sources"])
          for flag in ("release_eligible","access_certified","complete_global_competition","road_coverage_certified","parent_exterior_coverage_certified","datum_alignment_verified"):
              assert r[flag] is False
          assert r["applied_source_exclusions"]==[]
          PYCHECK
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: colorado-two-partition-routing
          path: two-partition-routing/
          retention-days: 14
