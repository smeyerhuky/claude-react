name: Dated northern site imagery evidence
on:
  pull_request:
    paths:
      - 'scripts/*northern_site_imagery.py'
      - 'docs/research/northern-site-imagery/**'
      - 'docs/research/northern-endpoint-evidence/**'
      - 'docs/research/northern-local-detours/report.json'
      - '.github/workflows/northern-site-imagery.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dated-primary-scene-and-pixel-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'networkx==3.7' 'osmium==4.3.2' 'tzdata==2026.5' 'pyproj==3.8.0' 'pillow==12.3.0' 'openpyxl==3.1.5'
      - name: Reject wrong dates, partial coverage, missing pixels and promoted claims
        run: python -m unittest discover -s scripts -p test_northern_site_imagery.py -v
      - name: Re-fetch individual primary items and all five exact small crops
        run: python scripts/northern_site_imagery.py --original-dir "$RUNNER_TEMP/northern-site-originals" --download
      - name: Preserve the historical 33-source checkpoint
        run: python scripts/las_vegas_ui_checkpoint.py --check-frozen
      - name: Retain dated observations and source receipts without raster originals
        run: |
          mkdir -p /tmp/northern-site-artifact
          cp docs/research/northern-site-imagery/* /tmp/northern-site-artifact/
          cp "$RUNNER_TEMP/northern-site-originals/fresh-source-receipts.json" /tmp/northern-site-artifact/
      - uses: actions/upload-artifact@v6
        with:
          name: northern-dated-site-imagery
          path: /tmp/northern-site-artifact/
          if-no-files-found: error
          retention-days: 14
