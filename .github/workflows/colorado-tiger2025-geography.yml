name: Colorado TIGER2025 official geography research
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/colorado-tiger2025-geography.yml'
      - 'scripts/colorado_tiger2025_geography.py'
      - 'scripts/test_colorado_tiger2025_geography.py'
      - 'scripts/colorado_geographic_mask.py'
      - 'scripts/colorado_town_geography_audit.py'
      - 'scripts/test_colorado_town_geography_audit.py'
      - 'scripts/colorado_png_geography_oracle.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/colorado-tiger2025-geography.yml'
      - 'scripts/colorado_tiger2025_geography.py'
      - 'scripts/test_colorado_tiger2025_geography.py'
      - 'scripts/colorado_town_geography_audit.py'
      - 'scripts/test_colorado_town_geography_audit.py'
permissions:
  contents: read
jobs:
  official-geography:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install TIGER and research masking dependencies
        run: python -m pip install 'pyshp>=2.3,<3' 'pyproj>=3.7,<4' 'shapely>=2,<3' 'numpy>=1.26,<3' 'pillow>=11,<13'
      - name: Offline synthetic county selection, missing water, and source corruption regressions
        run: PYTHONPATH=scripts python -m unittest scripts/test_colorado_tiger2025_geography.py scripts/test_colorado_town_geography_audit.py -v
      - uses: actions/cache@v4
        with:
          path: local-data/tiger2025
          key: tiger2025-census-2025-denver-southern-town-water-v2
      - name: Download real 2025 Census Colorado area-water and state polygons
        run: |
          set -euo pipefail
          mkdir -p colorado-geographic-validation
          timeout --signal=TERM --kill-after=30s 17m python -u scripts/colorado_tiger2025_geography.py \
            --bbox -105.1 39.65 -104.85 39.90 \
            --cache local-data/tiger2025 \
            --output-dir colorado-geographic-validation/tiger2025 \
            2>&1 | tee colorado-geographic-validation/tiger2025-source.log
      - name: Confirm water pixels are excluded using real Census geometry
        run: |
          set -euo pipefail
          python -u scripts/colorado_geographic_mask.py \
            --land-geojson colorado-geographic-validation/tiger2025/tiger2025-colorado-land.geojson \
            --water-geojson colorado-geographic-validation/tiger2025/tiger2025-colorado-areawater.geojson \
            --bounds -105.1 39.65 -104.85 39.90 --width 64 --height 64 \
            --output colorado-geographic-validation/tiger2025/census-water-mask.json
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("colorado-geographic-validation/tiger2025")
          m = json.loads((root/"tiger2025-geography-manifest.json").read_text())
          pixels = json.loads((root/"census-water-mask.json").read_text())
          assert m["release_eligible"] is False
          assert m["land_water_completeness_certified"] is False
          operation = m["coordinate_operation"]
          assert operation["source_crs"] == "EPSG:4269" and operation["target_crs"] == "EPSG:4326"
          assert operation["operation"] == "EPSG:1188" and operation["reported_operation_accuracy_m"] == 4
          assert operation["accuracy_is_absolute_error_bound"] is False
          assert operation["geographic_accuracy_certified"] is False
          assert all(s["native_crs"] == "EPSG:4269" and len(s["prj_sha256"]) == 64 for s in m["source_archives"])
          assert len(m["selected_county_geoids"]) >= 1
          assert pixels["release_eligible"] is False
          assert pixels["pixel_counts"]["water_excluded"] > 0, "No Census water pixel in test viewport"
          assert pixels["pixel_counts"]["land_nonwater"] > 0
          print("Research mask result:", pixels["pixel_counts"])
          PY
      - name: Independently audit southern town geography and painted-water/off-land negatives
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 10m python -u scripts/colorado_town_geography_audit.py \
            --cache local-data/tiger2025 \
            --output-dir colorado-geographic-validation/southern-towns \
            2>&1 | tee colorado-geographic-validation/southern-town-geography.log
          python - <<'PYTOWNS'
          import json
          from pathlib import Path
          r=json.loads(Path("colorado-geographic-validation/southern-towns/town-geography-audit.json").read_text())
          assert r["release_eligible"] is False and r["road_access_certified"] is False
          assert r["land_water_completeness_certified"] is False
          assert {x["name"] for x in r["results"]}=={"antonito","ignacio","san-luis"}
          assert sum(x["independent_scalar_cells_checked"] for x in r["results"])==12288
          for case in r["results"]:
              assert case["unsupported_painted_cells"]==0
              assert sum(case["pixel_counts"].values())==4096
              assert case["pixel_counts"]["water_excluded"]>0 and case["pixel_counts"]["land_nonwater"]>0
              assert case["negative_rejections"]["water"]==1
              for flag in ("release_eligible","road_access_certified","land_water_completeness_certified","geographic_accuracy_certified"):
                  assert case[flag] is False
          antonito=next(x for x in r["results"] if x["name"]=="antonito")
          assert antonito["pixel_counts"]["outside_supplied_land"]>0
          assert antonito["negative_rejections"]["outside_land"]==1
          PYTOWNS
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: colorado-tiger2025-research-source
          path: colorado-geographic-validation/
          retention-days: 14
