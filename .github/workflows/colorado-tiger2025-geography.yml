name: Colorado TIGER2025 official geography research
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/colorado-tiger2025-geography.yml'
      - 'scripts/colorado_tiger2025_geography.py'
      - 'scripts/test_colorado_tiger2025_geography.py'
      - 'scripts/colorado_geographic_mask.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/colorado-tiger2025-geography.yml'
      - 'scripts/colorado_tiger2025_geography.py'
      - 'scripts/test_colorado_tiger2025_geography.py'
permissions:
  contents: read
jobs:
  official-geography:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install TIGER and research masking dependencies
        run: python -m pip install 'pyshp>=2.3,<3' 'shapely>=2,<3' 'numpy>=1.26,<3'
      - name: Offline synthetic county selection, missing water, and source corruption regressions
        run: PYTHONPATH=scripts python -m unittest scripts/test_colorado_tiger2025_geography.py -v
      - uses: actions/cache@v4
        with:
          path: local-data/tiger2025
          key: tiger2025-census-2025-denver-county-water-v1
      - name: Download real 2025 Census Colorado area-water and state polygons
        run: |
          set -euo pipefail
          mkdir -p colorado-geographic-validation
          timeout --signal=TERM --kill-after=30s 17m python -u scripts/colorado_tiger2025_geography.py \
            --bbox -105.1 39.65 -104.85 39.90 \
            --cache local-data/tiger2025 \
            --output-dir colorado-geographic-validation/tiger2025 \
            2>&1 | tee colorado-geographic-validation/tiger2025-source.log
      - name: Confirm water pixels are excluded using real Census geometry
        run: |
          set -euo pipefail
          python -u scripts/colorado_geographic_mask.py \
            --land-geojson colorado-geographic-validation/tiger2025/tiger2025-colorado-land.geojson \
            --water-geojson colorado-geographic-validation/tiger2025/tiger2025-colorado-areawater.geojson \
            --bounds -105.1 39.65 -104.85 39.90 --width 64 --height 64 \
            --output colorado-geographic-validation/tiger2025/census-water-mask.json
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("colorado-geographic-validation/tiger2025")
          m = json.loads((root/"tiger2025-geography-manifest.json").read_text())
          pixels = json.loads((root/"census-water-mask.json").read_text())
          assert m["release_eligible"] is False
          assert m["land_water_completeness_certified"] is False
          assert len(m["selected_county_geoids"]) >= 1
          assert pixels["release_eligible"] is False
          assert pixels["pixel_counts"]["water_excluded"] > 0, "No Census water pixel in test viewport"
          assert pixels["pixel_counts"]["land_nonwater"] > 0
          print("Research mask result:", pixels["pixel_counts"])
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: colorado-tiger2025-research-source
          path: colorado-geographic-validation/
          retention-days: 14
