name: Tucson parking publication integrity
on:
  pull_request:
    paths:
      - 'scripts/tucson_parking_publication.py'
      - 'scripts/test_tucson_parking_publication.py'
      - 'docs/research/tucson-parking-publication/**'
      - '.github/workflows/tucson-parking-publication.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publication-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'pypdf==6.10.0'
      - run: python -m unittest discover -s scripts -p test_tucson_parking_publication.py -v
      - run: python scripts/tucson_parking_publication.py
      - run: python scripts/las_vegas_ui_checkpoint.py --check-frozen
