name: Native Census point state inventory
on:
  pull_request:
    paths:
      - 'scripts/metro_native_state_inventory.py'
      - 'scripts/test_metro_native_state_inventory.py'
      - 'scripts/colorado_tiger2025_geography.py'
      - 'docs/research/native-state-inventory/**'
      - 'docs/research/utah-parent-reference/domains.json'
      - '.github/workflows/metro-native-state-inventory.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce-native-state-membership:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'shapely>=2,<3' 'pyproj>=3.7,<4' 'pyshp>=2.3,<3'
      - run: python -m unittest discover -s scripts -p 'test_metro_native_state_inventory.py' -v
      - run: curl --fail --location --retry 3 --max-time 120 https://www2.census.gov/geo/tiger/TIGER2025/STATE/tl_2025_us_state.zip --output tl_2025_us_state.zip
      - run: python scripts/metro_native_state_inventory.py --state-zip tl_2025_us_state.zip --output reproduced.json
      - run: cmp reproduced.json docs/research/native-state-inventory/report.json
